<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わ〜鯖せーへきポエム</title>
  <link rel="stylesheet" href="poem-style.css">
</head>
<body>

  <h1>わ〜鯖せーへきポエム</h1>

  <!-- 1. ログイン & ルーム参加 -->
  <div id="login-sec" class="card-panel">
    <h2>ルームに入る</h2>
    <input type="text" id="player-name" placeholder="あなたの名前">
    <input type="text" id="room-id" placeholder="ルームID（例：123）">
    <label style="display:flex; align-items:center; gap:6px; margin: 8px 0; font-size:14px; cursor:pointer;">
      <input type="checkbox" id="spectator-check"> 👀 最初は見学モード（観戦のみ）で入る
    </label>
    <button onclick="joinRoom()">参加する</button>
  </div>

  <!-- 2. ロビー & 素材登録 -->
  <div id="lobby-sec" class="card-panel" style="display:none;">
    <button id="role-toggle-btn-lobby" onclick="toggleRole()" style="background-color: #64748b; margin-bottom: 12px;">👀 見学モードに切り替える</button>

    <h2>1. ポエムの素材あつめ</h2>
    
    <p>好きな言葉やフレーズを入力して投稿してください。</p>
    <div id="word-inputs">
      <input type="text" class="poem-input" placeholder="フレーズ 1">
      <input type="text" class="poem-input" placeholder="フレーズ 2">
      <input type="text" class="poem-input" placeholder="フレーズ 3">
    </div>
    
    <button id="add-word-btn" onclick="addWords()">素材を追加</button>
    
    <div style="margin-top: 20px;">
      <h3>参加メンバー</h3>
      <div id="player-list"></div>
    </div>
    
    <button onclick="startGame()" style="background-color: #16a34a; margin-top: 20px;">ポエム作りを開始</button>
  </div>

  <!-- 3. ゲーム画面 -->
  <div id="game-sec" class="card-panel" style="display:none;">
    <button id="role-toggle-btn-game" onclick="toggleRole()" style="background-color: #64748b; margin-bottom: 12px;">👀 見学モードに切り替える</button>

    <h2>2. ポエムを紡ぐ</h2>

    <div class="section-title">集まった言葉（手札）</div>
    <div class="word-list" id="hand-list"></div>

    <h3 style="margin-top: 20px;">完成したポエム</h3>
    <div id="poem-display" class="display-area">（選択した言葉がここに並びます）</div>

    <div style="display: flex; gap: 8px;">
      <button onclick="clearPoem()" style="background-color: #dc2626; margin-top: 12px;">リセット</button>
      <button onclick="submitPoem()" style="background-color: #2563eb; margin-top: 12px;">ポエムを投稿</button>
    </div>

    <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">

    <h2>みんなの作品</h2>
    <div id="board-list"></div>
  </div>

  <script type="module" src="poem-main.js"></script>
</body>
</html>
