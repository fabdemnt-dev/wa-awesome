<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="影札の交渉 オンライン2〜4人対戦">
  <title>影札の交渉｜オンライン対戦</title>
  <link rel="stylesheet" href="shadow-card-online.css">
</head>
<body>
  <main class="online-shell">
    <header class="online-header">
      <div class="hero-art" aria-hidden="true">
        <img src="assets/shadow-card/title-key-visual.webp" alt="" width="1536" height="1024">
      </div>
      <p class="eyebrow">ONLINE MATCH</p>
      <h1>影札の交渉</h1>
      <p>2〜4人オンライン対戦／全5ラウンド</p>
    </header>

    <p id="status" class="status" aria-live="polite">匿名ログイン中…</p>

    <section id="entry" class="panel" hidden>
      <label>表示名<input id="display-name" maxlength="20" autocomplete="nickname" value="旅人"></label>
      <label>対戦人数
        <select id="player-count">
          <option value="2">2人（人間＋NPC 対 人間＋NPC）</option>
          <option value="3">3人（人間2人 対 人間＋NPC）</option>
          <option value="4">4人（人間2人 対 人間2人）</option>
        </select>
      </label>
      <button id="create-room" type="button">ルームを作る</button>
      <label>招待コード<input id="invite-code" maxlength="24" autocomplete="off" placeholder="SC2-……-……"></label>
      <button id="join-room" type="button">ルームに参加</button>

      <div class="npc-roster" aria-label="影札のNPCタイプ">
        <article class="npc-roster__item">
          <img src="assets/shadow-card/npc-support.webp" alt="" width="1024" height="1024" loading="lazy">
          <strong>支援型</strong>
        </article>
        <article class="npc-roster__item">
          <img src="assets/shadow-card/npc-aggressive.webp" alt="" width="1024" height="1024" loading="lazy">
          <strong>強気型</strong>
        </article>
        <article class="npc-roster__item">
          <img src="assets/shadow-card/npc-bluff.webp" alt="" width="1024" height="1024" loading="lazy">
          <strong>ブラフ型</strong>
        </article>
      </div>

      <a href="shadow-card.html">ひとり用へ戻る</a>
    </section>

    <section id="lobby" class="panel" hidden>
      <h2>待機室</h2>
      <p id="lobby-mode"></p>
      <p class="invite-code-line">招待コード：<strong id="shown-code">参加済み</strong><span id="copy-code-hint" class="copy-code-hint" hidden>タップでコピー</span></p>
      <ul id="members"></ul>
      <div id="lobby-npc" class="lobby-npc"></div>
      <button id="start-match" type="button" hidden>対戦を始める</button>
    </section>

    <section id="game" class="panel" hidden>
      <div class="score"><strong id="round-label">ROUND 1 / 5</strong><span id="score-label">0 - 0</span></div>
      <div id="npc-panel" class="npc-grid" aria-label="対戦NPC"></div>
      <p id="field-label" class="field-label"></p>
      <p id="deadline"></p>
      <div id="hand" class="hand" role="radiogroup" aria-label="自分の手札"></div>
      <button id="submit-card" type="button" disabled>このカードで決定</button>
      <div id="result"></div>
      <button id="next-round" type="button" hidden>次のラウンドへ</button>
      <a id="return-to-title" href="shadow-card.html" hidden>タイトルへ戻る</a>
    </section>
  </main>
  <script type="module" src="shadow-card-online-main.js"></script>
</body>
</html>
