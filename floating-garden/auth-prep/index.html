<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com https://www.google.com https://www.recaptcha.net; style-src 'self'; connect-src https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseappcheck.googleapis.com https://recaptchaenterprise.googleapis.com https://www.google.com https://www.recaptcha.net; frame-src https://www.google.com https://www.recaptcha.net https://wa-awesome.firebaseapp.com; img-src 'self' data:; base-uri 'none'; object-src 'none'; form-action 'none'"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>庭園の認証準備</title><link rel="stylesheet" href="style.css"><main><p class="eyebrow">庭園 · 準備専用</p><h1>この窓の認証を準備</h1><p id="intro">まだ準備は無効です。承認前には認証を作成せず、庭園の受付も開きません。</p><p id="status" role="status" aria-live="polite">確認は始めていません。</p><div><button id="existing" disabled>既存の匿名認証だけを確認</button><button id="create" disabled>承認した1件だけを準備</button><button id="stop">中止する</button></div><h2>窓を開いたまま</h2><p>この画面からゲーム通信は行いません。アカウントの識別子や認証情報は表示しません。</p><p>この環境では窓を閉じると保存が失われることがあります。閉じた場合や結果不明の場合は、作り直さず中止します。サーバー側の匿名アカウントは残る場合があります。</p><p>この画面のスイッチはアクセス制限ではなく、全体で2アカウントだけにする仕組みでもありません。</p></main><script type="module" src="app.js"></script></html>
