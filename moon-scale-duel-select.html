<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="月秤の決闘の遊び方を選ぶ">
  <title>月秤の決闘｜遊び方を選ぶ</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #080b20;
      --panel: rgba(22, 25, 59, .92);
      --silver: #dfe5ff;
      --muted: #aeb7da;
      --moon: #fff2b8;
      --violet: #a99af4;
      --line: #707ab1;
      --focus: #fff0a4;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--night);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--silver);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      background:
        radial-gradient(circle at 18% 8%, rgba(126, 107, 219, .23), transparent 27rem),
        radial-gradient(circle at 85% 28%, rgba(235, 226, 177, .1), transparent 22rem),
        linear-gradient(160deg, #080b20, #111333 58%, #090b22);
    }

    a { font: inherit; }

    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .page {
      width: min(calc(100% - 28px), 520px);
      margin: 0 auto;
      padding: 18px 0 max(40px, env(safe-area-inset-bottom));
    }

    .top-link {
      display: inline-flex;
      min-height: 44px;
      padding: 8px 0;
      align-items: center;
      color: #d9d2ff;
    }

    .mode-select {
      padding: 10px 0 0;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 2px;
      color: var(--violet);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      color: var(--moon);
      font-size: clamp(1.8rem, 8vw, 2.6rem);
      letter-spacing: .08em;
      line-height: 1.35;
    }

    .subtitle {
      margin: 4px 0 18px;
      color: var(--muted);
    }

    .moon-art {
      display: block;
      width: 100%;
      height: 112px;
      margin-bottom: 18px;
      overflow: hidden;
      border: 1px solid rgba(142, 151, 205, .55);
      border-radius: 16px;
      background: #11162f;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .25);
    }

    .moon-art img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 50% 50%;
    }

    .mode-list {
      display: grid;
      gap: 12px;
    }

    .mode-link {
      display: grid;
      min-height: 92px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      align-content: center;
      color: var(--silver);
      text-decoration: none;
      background: var(--panel);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .2);
      transition: border-color .16s ease, transform .16s ease, background .16s ease;
    }

    .mode-link:hover,
    .mode-link:focus-visible {
      border-color: var(--focus);
      background: rgba(38, 43, 93, .96);
      transform: translateY(-1px);
    }

    .mode-title {
      color: var(--moon);
      font-size: 1.12rem;
      font-weight: 800;
    }

    .mode-description {
      color: var(--muted);
      font-size: .9rem;
    }

    @media (max-width: 420px) {
      .page {
        width: min(calc(100% - 20px), 520px);
        padding-top: 6px;
      }

      .mode-select { padding-top: 4px; }
      .subtitle { margin-bottom: 12px; }
      .moon-art { height: 88px; margin-bottom: 12px; }
      .mode-link { min-height: 84px; padding: 13px 15px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .mode-link { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <a class="top-link" href="toybox/">← 🎪 おもちゃ箱へ戻る</a>
    <section class="mode-select" aria-labelledby="mode-heading">
      <p class="eyebrow">CHOOSE A MODE</p>
      <h1 id="mode-heading">月秤の決闘</h1>
      <p class="subtitle">遊び方を選んでください</p>
      <div class="moon-art" aria-hidden="true">
        <img src="moon-scale-duel/assets/images/duel/duel-scene-background.webp" alt="">
      </div>
      <nav class="mode-list" aria-label="遊び方">
        <a class="mode-link" href="moon-scale-duel/">
          <span class="mode-title">1人で遊ぶ</span>
          <span class="mode-description">コンピューターと対戦</span>
        </a>
        <a class="mode-link" href="moon-scale-duel-online.html">
          <span class="mode-title">2人で遊ぶ</span>
          <span class="mode-description">招待コードで友だちと対戦</span>
        </a>
      </nav>
    </section>
  </main>
</body>
</html>
