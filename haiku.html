<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>わ〜鯖せーへき俳句</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .card-box {
      background: white;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      margin-bottom: 16px;
    }
    h1, h2, h3 {
      margin-top: 0;
      color: #1e293b;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px;
      margin: 6px 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }
    button:disabled {
      background-color: #94a3b8;
    }
    .btn-secondary { background-color: #64748b; }
    .btn-success { background-color: #22c55e; }
    .btn-purple { background-color: #a855f7; }
    .btn-outline {
      background-color: transparent;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    .hand-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }
    .phrase-section {
      background: #f1f5f9;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .phrase-title {
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      color: #475569;
    }
    .card-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .card {
      padding: 8px 12px;
      background: white;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      font-weight: bold;
    }
    .card.selected {
      background: #dbeafe;
      border-color: #3b82f6;
      color: #1d4ed8;
    }
    .player-board {
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin-bottom: 12px;
    }
    .word-tag {
      display: inline-block;
      padding: 4px 8px;
      margin: 2px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      border: 1px solid transparent;
    }
    .author-label {
      font-size: 10px;
      opacity: 0.75;
      margin-left: 2px;
    }
    .setting-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 8px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
    }
    .toggle-box label {
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }
    .spectator-badge {
      display: inline-block;
      background: #e2e8f0;
      color: #475569;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div id="login-screen" class="card-box">
    <h1>わ〜鯖せーへき俳句</h1>
    <p>名前に「さん」は自動でつきません。手入力してください。</p>
    <label>プレイヤー名</label>
    <input type="text" id="my-name-input" placeholder="例: ひなたさん">
    <label>ルームID</label>
    <input type="text" id="room-id-input" value="haiku-room">
    <button onclick="joinRoom()">入室する</button>
  </div>

  <div id="game-screen" style="display: none;">
    <div class="card-box" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <small>部屋名: <span id="display-room-id"></span></small><br>
        <strong>プレイヤー: <span id="display-my-name"></span></strong>
        <span id="spectator-indicator" class="spectator-badge" style="display:none;">👀 見学中</span>
      </div>
      <button class="btn-outline" style="width:auto; padding:6px 12px; margin:0; font-size:12px;" onclick="location.reload()">退出</button>
    </div>

    <!-- ロビー画面 -->
    <div id="lobby-view" class="card-box" style="display: none;">
      <h2>第 <span id="round-num">1</span> 回 ロビー</h2>

      <!-- 見学切替トグル -->
      <div class="toggle-box">
        <label for="spectator-toggle">👀 この回は見学（離席）する</label>
        <input type="checkbox" id="spectator-toggle" onchange="toggleSpectator(this.checked)">
      </div>

      <div style="margin-bottom: 16px;">
        <strong>参加メンバー:</strong>
        <div id="player-list" style="margin-top: 6px;"></div>
      </div>

      <!-- プレイヤーのみ表示する単語入力フォーム（上の句・中の句・下の句） -->
      <div id="words-input-section">
        <h3>素材の単語を入力</h3>
        <p style="font-size:12px; color:#64748b;">各句の欄に指定数のフレーズを入力してください。</p>
        
        <label>【上の句 (5音想定)】</label>
        <div id="inputs-kami-container"></div>
        
        <label>【中の句 (7音想定)】</label>
        <div id="inputs-naka-container"></div>

        <label>【下の句 (5音想定)】</label>
        <div id="inputs-shimo-container"></div>

        <button id="add-word-btn" class="btn-success" onclick="addWords()">単語を追加して準備完了！</button>
      </div>

      <!-- 見学者用の案内メッセージ -->
      <div id="spectator-input-notice" style="display:none; background:#f1f5f9; padding:12px; border-radius:8px; text-align:center; color:#64748b; font-weight:bold; margin-bottom:16px;">
        👀 現在「見学モード」です。素材入力はスキップされます。
      </div>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

      <p>集まった素材数 — 上: <strong id="count-kami">0</strong> / 中: <strong id="count-naka">0</strong> / 下: <strong id="count-shimo">0</strong></p>
      <button id="start-game-btn" onclick="startGame()">ゲームを開始する！</button>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

      <!-- ホスト向け設定アコーディオン -->
      <div class="setting-header" onclick="toggleSettings()">
        <strong>⚙️ ゲーム設定（枚数調整）</strong>
        <span id="setting-arrow">▼</span>
      </div>
      <div id="setting-body" style="display: none; margin-top: 12px;">
        <label>1人が入力する各句の数（各パート共通）</label>
        <input type="number" id="set-in-words" value="1" min="1">
        <label>1人に配る手札数（各パート共通）</label>
        <input type="number" id="set-hand-words" value="2" min="1">
        <button class="btn-secondary" onclick="updateSettings()">設定を更新</button>
      </div>
    </div>

    <!-- プレイ画面 -->
    <div id="playing-view" class="card-box" style="display: none;">
      <h2>俳句を詠んでいます...</h2>

      <!-- プレイヤー用操作画面 -->
      <div id="player-playing-section">
        <h3>あなたの手札から選択</h3>
        <div class="hand-container">
          <div class="phrase-section">
            <div class="phrase-title">上の句</div>
            <div id="hand-kami" class="card-group"></div>
          </div>
          <div class="phrase-section">
            <div class="phrase-title">中の句</div>
            <div id="hand-naka" class="card-group"></div>
          </div>
          <div class="phrase-section">
            <div class="phrase-title">下の句</div>
            <div id="hand-shimo" class="card-group"></div>
          </div>
        </div>

        <h3>完成した句</h3>
        <div id="selected-haiku-display" style="min-height: 48px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1; font-weight: bold; font-size: 18px; text-align: center; margin-bottom: 12px;">
          ───
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn-secondary" onclick="clearPhrase()">リセット</button>
          <button class="btn-purple" onclick="submitPhrase()">これで決定・提出！</button>
        </div>
      </div>

      <!-- 見学者用メッセージ -->
      <div id="spectator-playing-notice" style="display:none; background:#f1f5f9; padding:16px; border-radius:8px; text-align:center; color:#64748b; font-weight:bold; margin-bottom:16px;">
        👀 現在「見学モード」です。プレイヤーの提出をお待ちください。
      </div>

      <hr style="margin: 20px 0; border: 0; border-top: 1px solid #e2e8f0;">

      <h3>みんなの俳句ボード</h3>
      <div id="board-list"></div>

      <button id="next-round-btn" class="btn-success" style="margin-top: 16px;" onclick="nextRound()">つぎの句を詠む（ロビーへ）</button>
    </div>

    <!-- 履歴出力エリア -->
    <div class="card-box">
      <h3>📜 過去の履歴出力</h3>
      <div style="display: flex; gap: 8px;">
        <button class="btn-secondary" onclick="exportText()">Discord用にコピー</button>
        <button class="btn-secondary" onclick="exportCSV()">CSVファイルを保存</button>
      </div>
    </div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // -------------------------------------------------------------
    // 【Firebase設定】
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyBtb74uz6clsoc9uA_AkDHi7DdepEWn2dw",
      authDomain: "wa-awesome.firebaseapp.com",
      projectId: "wa-awesome",
      storageBucket: "wa-awesome.firebasestorage.app",
      messagingSenderId: "1074804319870",
      appId: "1:1074804319870:web:923f0ec866812f98ae5a2f",
      measurementId: "G-DH30YVYB2X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // グローバル状態
    let myName = "";
    let roomId = "";
    let roomRef = null;
    let roomData = null;
    let isSpectator = false;

    let selectedKami = null;
    let selectedNaka = null;
    let selectedShimo = null;

    // 入室処理
    window.joinRoom = async function() {
      const nameInput = document.getElementById("my-name-input").value.trim();
      const roomInput = document.getElementById("room-id-input").value.trim();

      if (!nameInput || !roomInput) {
        alert("名前とルームIDを入力してください");
        return;
      }

      myName = nameInput;
      roomId = roomInput;
      roomRef = doc(db, "haiku_rooms", roomId);

      document.getElementById("display-my-name").innerText = myName;
      document.getElementById("display-room-id").innerText = roomId;

      document.getElementById("login-screen").style.display = "none";
      document.getElementById("game-screen").style.display = "block";

      // リアルタイムリスナー開始
      onSnapshot(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          // 初期データ作成
          const initialData = {
            status: "lobby",
            round: 1,
            settings: { inWords: 1, handWords: 2 },
            players: {},
            pools: { kami: [], naka: [], shimo: [] },
            hands: {},
            phrases: {},
            phraseDetails: {},
            history: []
          };
          setDoc(roomRef, initialData);
        } else {
          roomData = snapshot.data();
          renderApp();
        }
      });
    };

    // 見学トグルの切り替え
    window.toggleSpectator = async function(checked) {
      isSpectator = checked;
      const indicator = document.getElementById("spectator-indicator");
      if (indicator) indicator.style.display = isSpectator ? "inline-block" : "none";

      if (!roomData) return;

      const currentPlayers = roomData.players || {};
      const myData = currentPlayers[myName] || { status: "joined" };
      
      myData.isSpectator = isSpectator;

      await updateDoc(roomRef, {
        [`players.${myName}`]: myData
      });
    };

    // 設定パネルの折りたたみ表示
    window.toggleSettings = function() {
      const body = document.getElementById("setting-body");
      const arrow = document.getElementById("setting-arrow");
      if (body.style.display === "none") {
        body.style.display = "block";
        arrow.innerText = "▲";
      } else {
        body.style.display = "none";
        arrow.innerText = "▼";
      }
    };

    // 設定更新
    window.updateSettings = async function() {
      const inWords = parseInt(document.getElementById("set-in-words").value) || 1;
      const handWords = parseInt(document.getElementById("set-hand-words").value) || 2;

      await updateDoc(roomRef, {
        "settings.inWords": inWords,
        "settings.handWords": handWords
      });
      alert("設定を更新しました");
    };

    // アプリ状態のレンダリング
    function renderApp() {
      if (!roomData) return;

      const round = roomData.round || 1;
      document.getElementById("round-num").innerText = round;

      // 自分の最新の見学状態を同期
      if (roomData.players && roomData.players[myName]) {
        isSpectator = !!roomData.players[myName].isSpectator;
        document.getElementById("spectator-toggle").checked = isSpectator;
        document.getElementById("spectator-indicator").style.display = isSpectator ? "inline-block" : "none";
      }

      if (roomData.status === "lobby") {
        document.getElementById("lobby-view").style.display = "block";
        document.getElementById("playing-view").style.display = "none";
        renderLobby();
      } else {
        document.getElementById("lobby-view").style.display = "none";
        document.getElementById("playing-view").style.display = "block";
        renderPlaying();
      }
    }

    // ロビー画面の表示更新
    function renderLobby() {
      const players = roomData.players || {};
      const playerListEl = document.getElementById("player-list");
      playerListEl.innerHTML = "";

      let activePlayerCount = 0;

      Object.keys(players).forEach(pName => {
        const pData = players[pName];
        const isSpec = pData.isSpectator;
        if (!isSpec) activePlayerCount++;

        const div = document.createElement("div");
        div.style.margin = "4px 0";
        div.innerHTML = `・${pName} ${isSpec ? '<span class="spectator-badge">👀 見学</span>' : (pData.ready ? '✅ 準備完了' : '⏳ 入力中...')}`;
        playerListEl.appendChild(div);
      });

      // 自分が見学かプレイヤーかで画面切り替え
      const wordsInputSection = document.getElementById("words-input-section");
      const spectatorNotice = document.getElementById("spectator-input-notice");

      if (isSpectator) {
        wordsInputSection.style.display = "none";
        spectatorNotice.style.display = "block";
      } else {
        wordsInputSection.style.display = "block";
        spectatorNotice.style.display = "none";

        // 各句の入力欄生成（設定数に応じた数）
        const inWordsCount = (roomData.settings && roomData.settings.inWords) || 1;
        
        ['kami', 'naka', 'shimo'].forEach(type => {
          const container = document.getElementById(`inputs-${type}-container`);
          if (container.children.length !== inWordsCount) {
            container.innerHTML = "";
            for (let i = 0; i < inWordsCount; i++) {
              const input = document.createElement("input");
              input.type = "text";
              input.placeholder = `${type === 'kami' ? '上の句' : type === 'naka' ? '中の句' : '下の句'} ${i + 1}`;
              input.className = `word-input-${type}`;
              container.appendChild(input);
            }
          }
        });
      }

      // 素材プール数表示
      const pools = roomData.pools || { kami: [], naka: [], shimo: [] };
      document.getElementById("count-kami").innerText = (pools.kami || []).length;
      document.getElementById("count-naka").innerText = (pools.naka || []).length;
      document.getElementById("count-shimo").innerText = (pools.shimo || []).length;
    }
    // 単語追加処理
    window.addWords = async function() {
      const getInputs = (type) => document.querySelectorAll(`.word-input-${type}`);
      const inWordsCount = (roomData.settings && roomData.settings.inWords) || 1;

      const kamiInputs = getInputs('kami');
      const nakaInputs = getInputs('naka');
      const shimoInputs = getInputs('shimo');

      const newKami = [];
      const newNaka = [];
      const newShimo = [];

      kamiInputs.forEach(ip => ip.value.trim() && newKami.push({ word: ip.value.trim(), author: myName }));
      nakaInputs.forEach(ip => ip.value.trim() && newNaka.push({ word: ip.value.trim(), author: myName }));
      shimoInputs.forEach(ip => ip.value.trim() && newShimo.push({ word: ip.value.trim(), author: myName }));

      if (newKami.length < inWordsCount || newNaka.length < inWordsCount || newShimo.length < inWordsCount) {
        alert(`上の句・中の句・下の句をそれぞれ ${inWordsCount} 個ずつすべて入力してください`);
        return;
      }

      const pools = roomData.pools || { kami: [], naka: [], shimo: [] };

      await updateDoc(roomRef, {
        "pools.kami": [...(pools.kami || []), ...newKami],
        "pools.naka": [...(pools.naka || []), ...newNaka],
        "pools.shimo": [...(pools.shimo || []), ...newShimo],
        [`players.${myName}.ready`]: true
      });

      [...kamiInputs, ...nakaInputs, ...shimoInputs].forEach(ip => ip.value = "");
      alert("句の素材を追加しました！");
    };

    // ゲーム開始（山札シャッフル・手札配布）
    window.startGame = async function() {
      const pools = roomData.pools || { kami: [], naka: [], shimo: [] };
      const players = roomData.players || {};
      const activePlayers = Object.keys(players).filter(p => !players[p].isSpectator);

      if (activePlayers.length === 0) {
        alert("プレイするメンバーが最低1人は必要です（見学のみでは開始できません）");
        return;
      }

      const handWordsCount = (roomData.settings && roomData.settings.handWords) || 2;
      const requiredWords = activePlayers.length * handWordsCount;

      if ((pools.kami || []).length < requiredWords || 
          (pools.naka || []).length < requiredWords || 
          (pools.shimo || []).length < requiredWords) {
        alert(`素材が足りません！各パート ${requiredWords} 個以上必要です。`);
        return;
      }

      // シャッフル
      const kShuffled = [...pools.kami].sort(() => Math.random() - 0.5);
      const nShuffled = [...pools.naka].sort(() => Math.random() - 0.5);
      const sShuffled = [...pools.shimo].sort(() => Math.random() - 0.5);

      const hands = {};

      activePlayers.forEach(pName => {
        hands[pName] = {
          kami: kShuffled.splice(0, handWordsCount),
          naka: nShuffled.splice(0, handWordsCount),
          shimo: sShuffled.splice(0, handWordsCount)
        };
      });

      await updateDoc(roomRef, {
        status: "playing",
        hands: hands,
        phrases: {},
        phraseDetails: {}
      });
    };

    // プレイ画面の描画
    function renderPlaying() {
      const playerPlayingSection = document.getElementById("player-playing-section");
      const spectatorPlayingNotice = document.getElementById("spectator-playing-notice");

      if (isSpectator) {
        playerPlayingSection.style.display = "none";
        spectatorPlayingNotice.style.display = "block";
      } else {
        playerPlayingSection.style.display = "block";
        spectatorPlayingNotice.style.display = "none";

        const myHand = (roomData.hands && roomData.hands[myName]) || { kami: [], naka: [], shimo: [] };

        renderHandPart('kami', myHand.kami || []);
        renderHandPart('naka', myHand.naka || []);
        renderHandPart('shimo', myHand.shimo || []);

        renderSelectedHaiku();
      }

      // 俳句ボード描画
      renderBoard();
    }

    // パーツ別手札の描画
    function renderHandPart(type, items) {
      const container = document.getElementById(`hand-${type}`);
      container.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        const isSelected = (type === 'kami' && selectedKami === index) ||
                           (type === 'naka' && selectedNaka === index) ||
                           (type === 'shimo' && selectedShimo === index);

        card.className = `card ${isSelected ? 'selected' : ''}`;
        card.innerText = item.word;
        card.onclick = () => selectCard(type, index);
        container.appendChild(card);
      });
    }

    // カード選択
    function selectCard(type, index) {
      if (type === 'kami') selectedKami = index;
      if (type === 'naka') selectedNaka = index;
      if (type === 'shimo') selectedShimo = index;
      renderPlaying();
    }

    // 選択された俳句の表示
    function renderSelectedHaiku() {
      const displayEl = document.getElementById("selected-haiku-display");
      const myHand = (roomData.hands && roomData.hands[myName]) || { kami: [], naka: [], shimo: [] };

      const k = selectedKami !== null ? myHand.kami[selectedKami]?.word : "◯◯◯";
      const n = selectedNaka !== null ? myHand.naka[selectedNaka]?.word : "◯◯◯◯◯";
      const s = selectedShimo !== null ? myHand.shimo[selectedShimo]?.word : "◯◯◯";

      displayEl.innerText = `${k}　${n}　${s}`;
    }

    // やり直し
    window.clearPhrase = function() {
      selectedKami = null;
      selectedNaka = null;
      selectedShimo = null;
      renderPlaying();
    };

    // 提出
    window.submitPhrase = async function() {
      if (selectedKami === null || selectedNaka === null || selectedShimo === null) {
        alert("上の句・中の句・下の句をそれぞれ1つずつ選択してください");
        return;
      }

      const myHand = (roomData.hands && roomData.hands[myName]) || { kami: [], naka: [], shimo: [] };
      const itemK = myHand.kami[selectedKami];
      const itemN = myHand.naka[selectedNaka];
      const itemS = myHand.shimo[selectedShimo];

      const fullText = `${itemK.word} ${itemN.word} ${itemS.word}`;
      const details = [itemK, itemN, itemS];

      await updateDoc(roomRef, {
        [`phrases.${myName}`]: fullText,
        [`phraseDetails.${myName}`]: details
      });

      alert("句を提出しました！");
    };

    // みんなの俳句ボード描画
    function renderBoard() {
      const boardEl = document.getElementById("board-list");
      boardEl.innerHTML = "";
      const phrases = roomData.phrases || {};
      const phraseDetails = roomData.phraseDetails || {};

      Object.keys(phrases).forEach(pName => {
        const card = document.createElement("div");
        card.className = "player-board";

        const title = document.createElement("strong");
        title.innerText = `${pName} の作品:`;
        card.appendChild(title);

        const haikuBox = document.createElement("div");
        haikuBox.style.marginTop = "8px";

        const details = phraseDetails[pName] || [];
        if (details.length === 3) {
          details.forEach(item => {
            const tag = document.createElement("span");
            tag.className = "word-tag";
            tag.style.background = "#f1f5f9";
            tag.innerHTML = `${item.word} <span class="author-label">(${item.author})</span>`;
            haikuBox.appendChild(tag);
          });
        } else {
          haikuBox.innerText = phrases[pName];
        }

        card.appendChild(haikuBox);
        boardEl.appendChild(card);
      });
    }

    // 次のラウンドへ（履歴保存とリセット）
    window.nextRound = async function() {
      const phrases = roomData.phrases || {};
      const phraseDetails = roomData.phraseDetails || {};
      const currentRound = roomData.round || 1;

      // 履歴に保存するレコードを作成
      const historyRecord = {
        round: currentRound,
        phrases: phrases,
        phraseDetails: phraseDetails,
        timestamp: new Date().toISOString()
      };

      const updatedHistory = [...(roomData.history || []), historyRecord];

      // プレイヤーの準備状態リセット（見学フラグは保持）
      const updatedPlayers = {};
      Object.keys(roomData.players || {}).forEach(pName => {
        updatedPlayers[pName] = {
          ready: false,
          isSpectator: !!roomData.players[pName].isSpectator
        };
      });

      selectedKami = null;
      selectedNaka = null;
      selectedShimo = null;

      await updateDoc(roomRef, {
        status: "lobby",
        round: currentRound + 1,
        pools: { kami: [], naka: [], shimo: [] },
        hands: {},
        phrases: {},
        phraseDetails: {},
        players: updatedPlayers,
        history: updatedHistory
      });
    };

    // --- 履歴出力機能 ---

    // Discord用テキスト生成
    window.exportText = function() {
      if (!roomData) return;
      const history = roomData.history || [];
      const currentPhrases = roomData.phrases || {};
      const currentDetails = roomData.phraseDetails || {};
      const currentRound = roomData.round || 1;

      let text = `【わ〜鯖せーへき俳句 履歴一覧】\n\n`;

      // 過去ラウンド
      history.forEach(h => {
        text += `━━━ 第 ${h.round} 回 ━━━\n`;
        Object.keys(h.phrases || {}).forEach(pName => {
          const details = (h.phraseDetails && h.phraseDetails[pName]) || [];
          if (details.length === 3) {
            const wordsStr = details.map(d => `${d.word}(${d.author})`).join(" ");
            text += `・${pName}: ${wordsStr}\n`;
          } else {
            text += `・${pName}: ${h.phrases[pName]}\n`;
          }
        });
        text += `\n`;
      });

      // 進行中ラウンド（未保存分）
      if (Object.keys(currentPhrases).length > 0) {
        text += `━━━ 第 ${currentRound} 回（最新） ━━━\n`;
        Object.keys(currentPhrases).forEach(pName => {
          const details = currentDetails[pName] || [];
          if (details.length === 3) {
            const wordsStr = details.map(d => `${d.word}(${d.author})`).join(" ");
            text += `・${pName}: ${wordsStr}\n`;
          } else {
            text += `・${pName}: ${currentPhrases[pName]}\n`;
          }
        });
      }

      navigator.clipboard.writeText(text).then(() => {
        alert("Discord用テキストをクリップボードにコピーしました！");
      }).catch(err => {
        console.error(err);
        alert("コピーに失敗しました");
      });
    };

    // CSVダウンロード
    window.exportCSV = function() {
      if (!roomData) return;
      const history = roomData.history || [];
      const currentPhrases = roomData.phrases || {};
      const currentDetails = roomData.phraseDetails || {};
      const currentRound = roomData.round || 1;

      let csv = "\uFEFF回数,プレイヤー名,完成俳句,構成要素(単語と提供者)\n";

      const processRow = (roundNum, pName, fullText, details) => {
        const safeText = `"${(fullText || "").replace(/"/g, '""')}"`;
        const wordsStr = details.length === 3
          ? `"${details.map(d => `${d.word}(${d.author})`).join(" ")}"`
          : safeText;
        return `${roundNum},"${pName}",${safeText},${wordsStr}\n`;
      };

      history.forEach(h => {
        Object.keys(h.phrases || {}).forEach(pName => {
          const details = (h.phraseDetails && h.phraseDetails[pName]) || [];
          csv += processRow(h.round, pName, h.phrases[pName], details);
        });
      });

      if (Object.keys(currentPhrases).length > 0) {
        Object.keys(currentPhrases).forEach(pName => {
          const details = currentDetails[pName] || [];
          csv += processRow(currentRound, pName, currentPhrases[pName], details);
        });
      }

      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `haiku_history_${roomId}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
