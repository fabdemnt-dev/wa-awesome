<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>月秤の決闘 中央公開札イラスト比較</title>
  <style>
    :root { color-scheme: dark; --night:#080b20; --panel:rgba(22,25,59,.92); --silver:#dfe5ff; --muted:#aeb7da; --moon:#fff2b8; --line:#707ab1; --focus:#fff0a4; }
    * { box-sizing: border-box; }
    html { background: var(--night); }
    body { margin:0; min-width:0; color:var(--silver); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; background:radial-gradient(circle at 18% 8%,rgba(126,107,219,.23),transparent 27rem),linear-gradient(160deg,#080b20,#111333 58%,#090b22); min-height:100vh; }
    button,select { font:inherit; touch-action:manipulation; }
    button:focus-visible,select:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    main { width:min(100% - 28px,920px); margin:0 auto; padding:22px 0 48px; }
    header { text-align:center; margin-bottom:14px; }
    h1 { color:var(--moon); font-size:clamp(1.45rem,6vw,2.2rem); margin:0; }
    .lead,.note { color:var(--muted); }
    .lead { margin:4px auto 0; max-width:720px; }
    .controls,.variant { margin-top:14px; padding:16px; border:1px solid rgba(142,151,205,.55); border-radius:18px; background:var(--panel); box-shadow:0 12px 32px rgba(0,0,0,.25); }
    .control-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .state-button,select,.next-button { min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:10px; color:#fff; background:#262b5d; }
    .state-button[aria-pressed="true"] { border-color:var(--focus); box-shadow:0 0 0 2px rgba(255,240,164,.2); color:var(--moon); }
    label { display:block; margin:12px 0 4px; color:var(--moon); font-weight:700; }
    select { width:min(100%,420px); }
    .variant h2 { margin:0; color:var(--moon); font-size:1.12rem; }
    .variant .note { margin:1px 0 10px; font-size:.86rem; }
    .duel { padding:18px; text-align:center; overflow:hidden; position:relative; }
    .moon-mark { width:58px; height:58px; border-radius:50%; margin:0 auto 7px; background:var(--moon); box-shadow:0 0 28px rgba(255,242,184,.38); position:relative; }
    .moon-mark::after { content:""; position:absolute; width:45px; height:45px; border-radius:50%; background:#171a3d; left:-5px; top:-4px; }
    .scale { color:#d7d2f6; letter-spacing:.1em; margin-bottom:12px; }
    .played { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:570px; margin:0 auto; }
    .played-card { min-width:0; min-height:118px; padding:10px 9px; border:1px solid #7079ad; border-radius:12px; background:linear-gradient(145deg,#252b60,#10132f); display:flex; flex-direction:column; justify-content:center; }
    .played-card.facedown { color:#c7ccec; background:repeating-linear-gradient(135deg,#171b43,#171b43 8px,#202657 8px,#202657 16px); }
    .played-label { color:var(--muted); font-size:.78rem; display:block; }
    .played-art { display:block; width:100%; margin:5px 0; overflow:hidden; border:1px solid rgba(190,198,239,.38); border-radius:8px; background:#101536; }
    .played-art img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
    .played-art.oath img { object-position:50% 35%; }
    .played-name { color:var(--moon); font-size:.94rem; font-weight:800; line-height:1.35; overflow-wrap:anywhere; }
    .variant-a .played-art { height:32px; }
    .variant-b .played-art { height:48px; }
    .variant-c .played-art { height:64px; }
    .message { min-height:3.2em; margin:12px auto 0; max-width:660px; text-align:left; background:rgba(6,8,27,.55); border-radius:10px; padding:9px 11px; }
    .message p { margin:2px 0; }
    .next-button { margin-top:10px; }
    [hidden] { display:none !important; }
    @media (max-width:620px) {
      main { width:min(100% - 20px,920px); padding-top:12px; }
      .controls,.variant { margin-top:10px; padding:10px; }
      .control-row { gap:6px; }
      .state-button { flex:1 1 105px; padding-inline:7px; font-size:.82rem; }
      .duel { padding:10px; }
      .moon-mark { width:40px; height:40px; margin-bottom:3px; }
      .moon-mark::after { width:31px; height:31px; }
      .scale { margin-bottom:7px; font-size:.88rem; }
      .played { gap:7px; }
      .played-card { min-height:82px; padding:7px 6px; }
      .played-name { font-size:.82rem; }
      .message { min-height:2.6em; margin-top:8px; padding:7px 9px; font-size:.85rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>中央公開札イラスト比較</h1>
      <p class="lead">本番とは独立した表示試作です。中央札の画像サイズと、公開前後の状態を比較できます。</p>
    </header>
    <section class="controls" aria-label="比較条件">
      <div class="control-row" id="stateControls"></div>
      <label for="exampleSelect">表示する札の組み合わせ</label>
      <select id="exampleSelect"></select>
    </section>
    <div id="variants"></div>
  </main>
  <script>
    const IMAGE_ROOT = '../../moon-scale-duel/assets/images/cards/';
    const CARDS = {
      waxing:{name:'満ちる月',image:'moon-full.webp'}, waning:{name:'欠ける月',image:'moon-waning.webp'},
      reflection:{name:'返照の月',image:'moon-reflection.webp'}, stillness:{name:'静止の月',image:'moon-still.webp'},
      falseMoon:{name:'偽りの月',image:'moon-false.webp'}, oath:{name:'新月の誓い',image:'moon-new-oath.webp'}
    };
    const VARIANTS = [
      {id:'a',title:'A：小さめ',height:'32px'},
      {id:'b',title:'B：中間',height:'48px'},
      {id:'c',title:'C：やや大きめ',height:'64px'}
    ];
    const STATES = [
      {id:'start',label:'ラウンド開始'}, {id:'facedown',label:'決定後・公開前'},
      {id:'revealed',label:'同時公開後'}, {id:'resolved',label:'効果解決後'},
      {id:'next',label:'次ラウンド開始'}, {id:'ended',label:'ゲーム終了'}
    ];
    const EXAMPLES = [
      {id:'pair1',label:'満ちる月 ／ 欠ける月',player:'waxing',cpu:'waning'},
      {id:'pair2',label:'返照の月 ／ 静止の月',player:'reflection',cpu:'stillness'},
      {id:'pair3',label:'偽りの月 ／ 新月の誓い',player:'falseMoon',cpu:'oath'},
      {id:'copied',label:'偽りの月：通常模倣',player:'falseMoon',cpu:'reflection',playerText:'偽りの月 → 返照の月'},
      {id:'blocked',label:'偽りの月：静止による無効化',player:'falseMoon',cpu:'stillness',playerText:'偽りの月（静止の月により無効化）'},
      {id:'failed',label:'偽りの月：模倣先なし・不発',player:'falseMoon',cpu:'oath',playerText:'偽りの月（模倣先なし・不発）'}
    ];
    let currentState = 'resolved';
    let currentExample = 'pair1';

    function cardFace(side, cardId, text, state) {
      const label = side === 'player' ? 'あなたの札' : '対手の札';
      if (state === 'start' || state === 'next') return `<div class="played-card${side === 'cpu' ? ' facedown' : ''}"><span class="played-label">${label}</span><span>${side === 'player' ? '未決定' : '伏せられている'}</span></div>`;
      if (state === 'facedown') return `<div class="played-card facedown"><span class="played-label">${label}</span><span>伏せ札</span></div>`;
      const card = CARDS[cardId];
      return `<div class="played-card"><span class="played-label">${label}</span><span class="played-art${cardId === 'oath' ? ' oath' : ''}" aria-hidden="true"><img src="${IMAGE_ROOT + card.image}" alt=""></span><strong class="played-name">${text || card.name}</strong></div>`;
    }

    function render() {
      const example = EXAMPLES.find(item => item.id === currentExample);
      document.getElementById('stateControls').innerHTML = STATES.map(state => `<button class="state-button" type="button" data-state="${state.id}" aria-pressed="${state.id === currentState}">${state.label}</button>`).join('');
      document.getElementById('exampleSelect').innerHTML = EXAMPLES.map(example => `<option value="${example.id}"${example.id === currentExample ? ' selected' : ''}>${example.label}</option>`).join('');
      document.getElementById('variants').innerHTML = VARIANTS.map(variant => `
        <section class="variant variant-${variant.id}" aria-labelledby="title-${variant.id}">
          <h2 id="title-${variant.id}">${variant.title}</h2>
          <p class="note">中央公開札の画像高さ ${variant.height}</p>
          <div class="duel">
            <div class="moon-mark" aria-hidden="true"></div><div class="scale">── 月秤 ──</div>
            <div class="played">
              ${cardFace('player', example.player, example.playerText, currentState)}
              ${cardFace('cpu', example.cpu, example.cpuText, currentState)}
            </div>
            <div class="message">
              <p>${currentState === 'start' || currentState === 'next' ? '未使用の月札を選んでください。' : currentState === 'facedown' ? '双方の月札が伏せられた。' : currentState === 'ended' ? '決闘が終了しました。最終月影を確認してください。' : '双方の公開札と、このラウンドの効果結果を確認できます。'}</p>
              ${currentState === 'resolved' || currentState === 'ended' ? '<p>月影は、あなた 10 → 10、対手 10 → 7 となった。</p>' : ''}
            </div>
            <button class="next-button" type="button" ${currentState === 'resolved' ? '' : 'hidden'}>次のラウンドへ</button>
          </div>
        </section>`).join('');
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('[data-state]');
      if (!button) return;
      currentState = button.dataset.state;
      render();
    });
    document.getElementById('exampleSelect').addEventListener('change', event => { currentExample = event.target.value; render(); });
    render();
  </script>
</body>
</html>
