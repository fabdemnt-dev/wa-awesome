<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>月秤の決闘 勝利イラスト比較</title>
  <style>
    :root { color-scheme:dark; --night:#080b20; --panel:rgba(22,25,59,.9); --silver:#dfe5ff; --muted:#aeb7da; --moon:#fff2b8; --line:#707ab1; --focus:#fff0a4; }
    * { box-sizing:border-box; }
    html { background:var(--night); }
    body { margin:0; min-width:0; min-height:100vh; color:var(--silver); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.65; background:radial-gradient(circle at 18% 8%,rgba(126,107,219,.23),transparent 27rem),radial-gradient(circle at 85% 28%,rgba(235,226,177,.1),transparent 22rem),linear-gradient(160deg,#080b20,#111333 58%,#090b22); }
    button,a { font:inherit; }
    button { touch-action:manipulation; }
    button:focus-visible,a:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .page { width:min(100% - 28px,920px); margin:0 auto; padding:18px 0 48px; }
    header { text-align:center; padding:6px 0 14px; }
    header h1 { margin:4px 0 0; color:var(--moon); font-size:clamp(1.55rem,7vw,2.25rem); letter-spacing:.05em; }
    header p { margin:2px 0 0; color:var(--muted); }
    .chooser { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:min(100%,420px); margin:0 auto 12px; }
    .chooser button,.primary-button { min-height:46px; padding:9px 16px; border:1px solid var(--line); border-radius:10px; color:#fff; background:#262b5d; cursor:pointer; }
    .chooser button[aria-pressed="true"] { border:2px solid var(--moon); color:var(--moon); box-shadow:0 0 0 2px rgba(255,242,184,.13); }
    .panel { border:1px solid rgba(142,151,205,.55); border-radius:18px; background:var(--panel); box-shadow:0 12px 32px rgba(0,0,0,.25); }
    .end-screen { text-align:center; padding:22px; margin-top:14px; }
    .end-screen h2 { color:var(--moon); font-size:1.7rem; margin:0 0 5px; }
    .end-reason { margin:4px 0; }
    .victory-art { display:block; width:100%; height:90px; margin:12px 0; overflow:hidden; border-radius:10px; background:#11162f; }
    .victory-art img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 48%; }
    .end-actions { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:12px; margin-top:16px; }
    .primary-button { width:min(100%,420px); border-color:#b8adf3; background:linear-gradient(135deg,#6554bb,#8274ce); font-weight:800; font-size:1.05rem; }
    .end-actions a { color:#ddd6ff; min-height:44px; padding:8px; }
    .note { margin:10px 2px 0; color:var(--muted); font-size:.84rem; text-align:center; }
    [hidden] { display:none !important; }
    @media (max-width:620px) { .page { width:min(100% - 20px,920px); padding-top:6px; } header { padding-bottom:8px; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>勝利イラスト A/B比較</h1>
      <p>同じ最終結果パネルで、画像の有無だけを比較する独立試作です。</p>
    </header>
    <nav class="chooser" aria-label="比較案を選択">
      <button type="button" data-mode="a" aria-pressed="true">A 画像なし</button>
      <button type="button" data-mode="b" aria-pressed="false">B 画像あり</button>
    </nav>
    <section class="end-screen panel" aria-labelledby="endTitle">
      <h2 id="endTitle">勝利</h2>
      <p class="end-reason">6ラウンド終了時、あなたの月影が多いため勝利です。</p>
      <span id="victoryArt" class="victory-art" hidden><img src="victory.jpg" alt="雲が開いた月夜に満月の光が広がる風景"></span>
      <p>最終月影　あなた 11 ／ 対手 8</p>
      <div class="end-actions">
        <button class="primary-button" type="button">もう一度決闘する</button>
        <a href="../../toybox/">🎪 おもちゃ箱へ戻る</a>
      </div>
    </section>
    <p id="note" class="note">A：現在と同じ、画像なしの最終結果パネルです。</p>
  </main>
  <script>
    'use strict';
    const art = document.getElementById('victoryArt');
    const note = document.getElementById('note');
    document.querySelectorAll('[data-mode]').forEach(button => {
      button.addEventListener('click', () => {
        const showArt = button.dataset.mode === 'b';
        art.hidden = !showArt;
        note.textContent = showArt ? 'B：勝利理由の下・最終月影の上に静止画を表示します。' : 'A：現在と同じ、画像なしの最終結果パネルです。';
        document.querySelectorAll('[data-mode]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
  </script>
</body>
</html>
