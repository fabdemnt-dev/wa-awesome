<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>月秤の決闘 ラウンド公開演出比較</title>
  <style>
    :root { color-scheme:dark; --night:#080b20; --panel:rgba(22,25,59,.92); --silver:#dfe5ff; --muted:#aeb7da; --moon:#fff2b8; --line:#707ab1; }
    * { box-sizing:border-box; }
    html { background:var(--night); }
    body { margin:0; min-width:0; min-height:100vh; color:var(--silver); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; background:radial-gradient(circle at 18% 8%,rgba(126,107,219,.23),transparent 27rem),linear-gradient(160deg,#080b20,#111333 58%,#090b22); }
    button { font:inherit; }
    .page { width:min(100% - 20px,720px); margin:0 auto; padding:12px 0 40px; }
    header { text-align:center; margin-bottom:12px; }
    h1 { margin:0; color:var(--moon); font-size:clamp(1.45rem,6vw,2.1rem); }
    header p { margin:4px 0 0; color:var(--muted); }
    .chooser { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
    .chooser button,.action-button { min-height:46px; border:1px solid var(--line); border-radius:10px; color:#fff; background:#262b5d; cursor:pointer; }
    .chooser button[aria-pressed="true"] { border:2px solid var(--moon); color:var(--moon); box-shadow:0 0 0 2px rgba(255,242,184,.13); }
    .variant { padding:10px; overflow:hidden; border:1px solid rgba(142,151,205,.55); border-radius:18px; background:var(--panel); box-shadow:0 12px 32px rgba(0,0,0,.25); text-align:center; }
    .variant h2 { margin:0; color:var(--moon); font-size:1.15rem; text-align:left; }
    .condition { margin:0 0 8px; color:var(--muted); font-size:.86rem; text-align:left; }
    .scene { position:relative; width:100%; height:84px; margin-bottom:12px; overflow:hidden; border:1px solid rgba(142,151,205,.5); border-radius:11px; background:#11162f; isolation:isolate; }
    .scene-bg { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
    .moonlight { position:absolute; inset:0; z-index:1; pointer-events:none; opacity:0; background:linear-gradient(104deg,rgba(189,225,255,0) 5%,rgba(189,225,255,.22) 39%,rgba(212,207,255,.14) 50%,rgba(191,183,255,.2) 61%,rgba(191,183,255,0) 95%); mix-blend-mode:screen; }
    .moonlight::before,.moonlight::after { content:""; position:absolute; inset:-25% -8%; opacity:0; }
    .moonlight::before { background:linear-gradient(112deg,rgba(180,220,255,.26),transparent 48%); transform:translateX(-18%); }
    .moonlight::after { background:linear-gradient(248deg,rgba(198,185,255,.24),transparent 48%); transform:translateX(18%); }
    .variant-b.is-revealing .moonlight { animation:moonlight-center 340ms ease-out both; }
    .variant-b.is-revealing .moonlight::before,.variant-b.is-revealing .moonlight::after { animation:moonlight-sides 340ms ease-out both; }
    .variant-c.is-revealing .moonlight { animation:moonlight-center 520ms ease-in-out both; }
    .variant-c.is-revealing .moonlight::before,.variant-c.is-revealing .moonlight::after { animation:moonlight-sides 520ms ease-in-out both; }
    @keyframes moonlight-center { 0%,100% { opacity:0; } 42% { opacity:.72; } 58% { opacity:.64; } }
    @keyframes moonlight-sides { 0%,100% { opacity:0; } 44% { opacity:1; transform:translateX(0); } 60% { opacity:.8; transform:translateX(0); } }
    .played { display:grid; grid-template-columns:1fr 1fr; gap:7px; max-width:570px; margin:0 auto; }
    .played-card { min-width:0; min-height:82px; padding:8px 6px; border:1px solid #7079ad; border-radius:12px; background:linear-gradient(145deg,#252b60,#10132f); display:grid; place-content:center; }
    .played-card.facedown { color:#c7ccec; background:repeating-linear-gradient(135deg,#171b43,#171b43 8px,#202657 8px,#202657 16px); }
    .played-label { display:block; color:var(--muted); font-size:.78rem; }
    .played-art { display:block; width:100%; height:48px; margin:6px 0; overflow:hidden; border-radius:7px; background:#11162f; }
    .played-art img { display:block; width:100%; height:100%; object-fit:cover; object-position:50% 50%; }
    .played-card strong { display:block; color:var(--moon); font-size:1rem; overflow-wrap:anywhere; }
    .message { min-height:2.6em; margin:8px auto 0; padding:7px 9px; border-radius:10px; background:rgba(6,8,27,.55); text-align:left; font-size:.87rem; }
    .message p { margin:2px 0; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }
    .action-button.secondary { background:#171b43; color:var(--silver); }
    .note { margin:10px 2px 0; color:var(--muted); font-size:.82rem; }
    [hidden] { display:none !important; }
    @media (min-width:621px) {
      .page { padding-top:20px; }
      .variant { padding:18px; }
      .played { gap:12px; }
      .played-card { min-height:118px; padding:13px 9px; }
      .message { margin-top:15px; padding:10px 12px; font-size:1rem; }
    }
    @media (prefers-reduced-motion:reduce) {
      .variant-b.is-revealing .moonlight,.variant-b.is-revealing .moonlight::before,.variant-b.is-revealing .moonlight::after,
      .variant-c.is-revealing .moonlight,.variant-c.is-revealing .moonlight::before,.variant-c.is-revealing .moonlight::after { animation:none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>ラウンド公開演出比較</h1>
      <p>同じ84px背景で、月光演出の時間だけを比較する独立試作です。</p>
    </header>
    <nav class="chooser" aria-label="比較案を選択">
      <button type="button" data-variant="a" aria-pressed="true">A 演出なし</button>
      <button type="button" data-variant="b" aria-pressed="false">B 340ms</button>
      <button type="button" data-variant="c" aria-pressed="false">C 520ms</button>
    </nav>
    <section id="variant" class="variant variant-a" aria-labelledby="variantTitle">
      <h2 id="variantTitle">A：現状（演出なし）</h2>
      <p id="condition" class="condition">背景は変化せず、札だけを同時公開します。</p>
      <div class="scene" aria-label="高さ84pxの共通月夜背景">
        <img class="scene-bg" src="../../moon-scale-duel/assets/images/duel/duel-scene-background.jpg" alt="暗い月夜の雲と左右の淡い光">
        <span class="moonlight" aria-hidden="true"></span>
      </div>
      <div class="played">
        <div id="playerCard" class="played-card facedown"><span class="played-label">あなたの札</span><span>伏せ札</span></div>
        <div id="cpuCard" class="played-card facedown"><span class="played-label">対手の札</span><span>伏せ札</span></div>
      </div>
      <div id="message" class="message"><p>「札を公開する」で双方の札を同時に表示します。</p></div>
      <div class="actions">
        <button id="revealButton" class="action-button" type="button">札を公開する</button>
        <button id="resetButton" class="action-button secondary" type="button">伏せ札に戻す</button>
      </div>
      <p class="note">札の公開や結果表示に待機時間は追加していません。何度でも再生できます。</p>
    </section>
  </main>
  <script>
    'use strict';
    const variant = document.getElementById('variant');
    const title = document.getElementById('variantTitle');
    const condition = document.getElementById('condition');
    const playerCard = document.getElementById('playerCard');
    const cpuCard = document.getElementById('cpuCard');
    const message = document.getElementById('message');
    const settings = {
      a: ['A：現状（演出なし）', '背景は変化せず、札だけを同時公開します。'],
      b: ['B：短い月光演出', '左右の月光が340msだけ淡く重なります。'],
      c: ['C：標準の月光演出', 'Bと同じ月光が520msで少しゆっくり重なります。']
    };
    let active = 'a';

    function resetCards() {
      variant.classList.remove('is-revealing');
      playerCard.className = 'played-card facedown';
      cpuCard.className = 'played-card facedown';
      playerCard.innerHTML = '<span class="played-label">あなたの札</span><span>伏せ札</span>';
      cpuCard.innerHTML = '<span class="played-label">対手の札</span><span>伏せ札</span>';
      message.innerHTML = '<p>「札を公開する」で双方の札を同時に表示します。</p>';
    }

    function revealCards() {
      resetCards();
      void variant.offsetWidth;
      variant.classList.add('is-revealing');
      playerCard.className = 'played-card';
      cpuCard.className = 'played-card';
      playerCard.innerHTML = '<span class="played-label">あなたの札</span><span class="played-art" aria-hidden="true"><img src="../../moon-scale-duel/assets/images/cards/moon-reflection.webp" alt=""></span><strong>返照の月</strong>';
      cpuCard.innerHTML = '<span class="played-label">対手の札</span><span class="played-art" aria-hidden="true"><img src="../../moon-scale-duel/assets/images/cards/moon-still.webp" alt=""></span><strong>静止の月</strong>';
      message.innerHTML = '<p>双方の月札が同時に公開された。</p><p>対手の「静止の月」により、あなたの「返照の月」は沈黙した。</p>';
    }

    document.querySelectorAll('[data-variant]').forEach(button => {
      button.addEventListener('click', () => {
        active = button.dataset.variant;
        document.querySelectorAll('[data-variant]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
        variant.className = `variant variant-${active}`;
        title.textContent = settings[active][0];
        condition.textContent = settings[active][1];
        resetCards();
      });
    });
    document.getElementById('revealButton').addEventListener('click', revealCards);
    document.getElementById('resetButton').addEventListener('click', resetCards);
  </script>
</body>
</html>
