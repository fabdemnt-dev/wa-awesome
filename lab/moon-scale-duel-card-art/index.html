<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>月秤の決闘 月札アート比較試作</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #080b20;
      --panel: rgba(22, 25, 59, .92);
      --silver: #dfe5ff;
      --muted: #aeb7da;
      --moon: #fff2b8;
      --line: #707ab1;
      --focus: #fff0a4;
    }
    * { box-sizing: border-box; }
    html { background: var(--night); }
    body {
      margin: 0;
      min-width: 0;
      color: var(--silver);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
      background:
        radial-gradient(circle at 18% 8%, rgba(126, 107, 219, .23), transparent 27rem),
        linear-gradient(160deg, #080b20, #111333 58%, #090b22);
      min-height: 100vh;
    }
    button { font: inherit; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    main { width: min(100% - 28px, 920px); margin: 0 auto; padding: 22px 0 48px; }
    header { text-align: center; margin-bottom: 18px; }
    h1 { color: var(--moon); font-size: clamp(1.55rem, 6vw, 2.25rem); margin: 0; }
    .lead { color: var(--muted); margin: 4px auto 0; max-width: 680px; }
    .notice { margin: 14px auto 0; padding: 8px 12px; max-width: 680px; border: 1px solid var(--line); border-radius: 10px; background: rgba(9, 11, 32, .68); font-size: .88rem; }
    .variant { margin-top: 14px; padding: 17px; border: 1px solid rgba(142, 151, 205, .55); border-radius: 18px; background: var(--panel); box-shadow: 0 12px 32px rgba(0,0,0,.25); }
    .variant h2 { color: var(--moon); font-size: 1.15rem; margin: 0; }
    .variant-note { color: var(--muted); margin: 1px 0 10px; font-size: .88rem; }
    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .card { min-width: 0; min-height: 142px; padding: 11px; text-align: left; color: var(--silver); border: 2px solid #59628f; border-radius: 12px; background: linear-gradient(150deg,#242958,#151837); cursor: pointer; }
    .card-art { display: block; width: 100%; margin-bottom: 9px; overflow: hidden; border: 1px solid rgba(190,198,239,.38); border-radius: 9px; background: #101536; box-shadow: inset 0 0 18px rgba(6,8,29,.6); }
    .card-art img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; }
    .variant-a .card-art { height: 56px; }
    .variant-b .card-art { height: 88px; }
    .variant-c .card-art { aspect-ratio: 3 / 2; }
    .position-comparison .card-art { height: 88px; }
    .position-comparison .position-up img { object-position: 50% 35%; }
    .position-comparison .position-center img { object-position: 50% 50%; }
    .position-comparison .position-down img { object-position: 50% 65%; }
    .final-candidate .card-art { height: 88px; }
    .final-candidate .card[data-card="oath"] .card-art img { object-position: 50% 35%; }
    .position-group + .position-group { margin-top: 18px; }
    .position-group h3 { margin: 0 0 8px; color: var(--moon); font-size: 1rem; }
    .cards.position-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .position-label { display: block; margin-bottom: 6px; color: #c7bdf7; font-size: .78rem; font-weight: 700; }
    .card-name { color: var(--moon); font-weight: 800; display: block; }
    .card-type { color: #c7bdf7; font-size: .75rem; display: block; margin: 2px 0 5px; }
    .card-effect { font-size: .82rem; display: block; line-height: 1.45; }
    .card.selected { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(255,240,164,.25); }
    .card.selected::after { content: "✓ 選択中"; display: block; color: #fff3b4; font-weight: 800; margin-top: 7px; }
    .card.used { opacity: .46; background: #11142d; cursor: not-allowed; }
    .card.used::after { content: "使用済み"; display: block; font-weight: 800; margin-top: 7px; }
    .card.used .card-art { filter: saturate(.58); }
    .decision { text-align: center; margin-top: 14px; }
    .primary-button { width: min(100%, 420px); min-height: 46px; padding: 9px 16px; border: 1px solid #b8adf3; border-radius: 10px; color: #fff; background: linear-gradient(135deg, #6554bb, #8274ce); font-weight: 800; font-size: 1.05rem; }
    .primary-button:disabled { cursor: not-allowed; opacity: .48; }
    .selection-status { min-height: 1.65em; margin: 6px 0 0; color: var(--muted); font-size: .82rem; text-align: center; }
    @media (min-width: 880px) {
      .cards { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      main { width: min(100% - 20px, 920px); padding-top: 12px; }
      header { margin-bottom: 10px; }
      .variant { padding: 10px; margin-top: 10px; }
      .cards {
        grid-template-columns: none;
        grid-auto-flow: column;
        grid-auto-columns: minmax(168px, 52%);
        gap: 8px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: x mandatory;
        scroll-padding-inline: 2px;
        padding: 3px 2px 10px;
      }
      .card { min-height: 120px; padding: 9px; scroll-snap-align: start; }
      .card-art { margin-bottom: 7px; }
      .card-effect { font-size: .77rem; }
      .decision { margin-top: 8px; }
      .cards.position-cards { grid-template-columns: none; }
    }
    @media (max-width: 355px) { .cards { grid-auto-columns: minmax(162px, 72%); } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>月札アート比較試作</h1>
      <p class="lead">同じ6枚を、現在相当・中間・3:2の3種類で比較します。</p>
      <p class="notice">比較用ページです。ゲーム進行・CPU・勝敗処理は含みません。欠ける月は使用済み見本として操作できません。</p>
    </header>
    <div id="variants"></div>
    <div id="positionComparison"></div>
    <div id="finalCandidate"></div>
  </main>
  <script>
    const CARDS = [
      { id: 'waxing', name: '満ちる月', type: '回復', effect: '自分の月影を3増やす', image: 'images/moon-full.webp' },
      { id: 'waning', name: '欠ける月', type: '攻撃', effect: '相手の月影を3減らす', image: 'images/moon-waning.webp', used: true },
      { id: 'reflection', name: '返照の月', type: '反転', effect: 'このラウンドの数値増減を反転する', image: 'images/moon-reflection.webp' },
      { id: 'stillness', name: '静止の月', type: '防御', effect: '相手の月札の効果を無効にする', image: 'images/moon-still.webp' },
      { id: 'falseMoon', name: '偽りの月', type: '変化', effect: '公開後、未使用の月札の効果を模倣する', image: 'images/moon-false.webp' },
      { id: 'oath', name: '新月の誓い', type: '逆転', effect: '公開時に劣勢なら双方の月影を7にする', image: 'images/moon-new-oath.webp' }
    ];
    const VARIANTS = [
      { id: 'a', title: 'A：現在相当', note: 'card-art 高さ 56px' },
      { id: 'b', title: 'B：中間', note: 'card-art 高さ 88px' },
      { id: 'c', title: 'C：画像本来の比率', note: 'card-art 3:2' }
    ];
    const POSITION_VARIANTS = [
      { id: 'center', label: '中央：50% 50%' },
      { id: 'up', label: '上側を多く表示：50% 35%' },
      { id: 'down', label: '下側を多く表示：50% 65%' }
    ];
    let selected = 'waxing';

    function render() {
      document.getElementById('variants').innerHTML = VARIANTS.map(variant => `
        <section class="variant variant-${variant.id}" aria-labelledby="title-${variant.id}">
          <h2 id="title-${variant.id}">${variant.title}</h2>
          <p class="variant-note">${variant.note}</p>
          <div class="cards" aria-label="${variant.title}の月札">
            ${CARDS.map(card => `
              <button class="card${card.used ? ' used' : ''}${selected === card.id ? ' selected' : ''}" type="button" data-card="${card.id}" ${card.used ? 'disabled' : ''} aria-pressed="${selected === card.id}">
                <span class="card-art"><img src="${card.image}" alt="${card.name}のイラスト"></span>
                <span class="card-name">${card.name}</span>
                <span class="card-type">${card.type}</span>
                <span class="card-effect">${card.effect}</span>
              </button>`).join('')}
          </div>
          <div class="decision"><button class="primary-button" type="button">この札で決定</button></div>
          <p class="selection-status" aria-live="polite">選択中：${CARDS.find(card => card.id === selected).name}</p>
        </section>`).join('');

      const comparisonCards = CARDS.filter(card => ['falseMoon', 'oath'].includes(card.id));
      document.getElementById('positionComparison').innerHTML = `
        <section class="variant position-comparison" aria-labelledby="position-title">
          <h2 id="position-title">B・88px 画像位置比較</h2>
          <p class="variant-note">高さとカードレイアウトはBのまま、画像の縦位置だけを比較します。</p>
          ${comparisonCards.map(card => `
            <div class="position-group">
              <h3>${card.name}</h3>
              <div class="cards position-cards" aria-label="${card.name}の画像位置比較">
                ${POSITION_VARIANTS.map(position => `
                  <button class="card${selected === card.id ? ' selected' : ''}" type="button" data-card="${card.id}" aria-pressed="${selected === card.id}">
                    <span class="position-label">${position.label}</span>
                    <span class="card-art position-${position.id}"><img src="${card.image}" alt="${card.name}のイラスト・${position.label}"></span>
                    <span class="card-name">${card.name}</span>
                    <span class="card-type">${card.type}</span>
                    <span class="card-effect">${card.effect}</span>
                  </button>`).join('')}
              </div>
              <div class="decision"><button class="primary-button" type="button">この札で決定</button></div>
              <p class="selection-status" aria-live="polite">選択中：${CARDS.find(item => item.id === selected).name}</p>
            </div>`).join('')}
        </section>`;

      document.getElementById('finalCandidate').innerHTML = `
        <section class="variant final-candidate" aria-labelledby="final-candidate-title">
          <h2 id="final-candidate-title">本番最終候補</h2>
          <p class="variant-note">スマホ手札候補：高さ88px。新月の誓いだけ上側を多く表示し、他の5枚は中央表示です。</p>
          <div class="cards" aria-label="本番最終候補の月札">
            ${CARDS.map(card => `
              <button class="card${card.used ? ' used' : ''}${selected === card.id ? ' selected' : ''}" type="button" data-card="${card.id}" ${card.used ? 'disabled' : ''} aria-pressed="${selected === card.id}">
                <span class="card-art"><img src="${card.image}" alt="${card.name}のイラスト"></span>
                <span class="card-name">${card.name}</span>
                <span class="card-type">${card.type}</span>
                <span class="card-effect">${card.effect}</span>
              </button>`).join('')}
          </div>
          <div class="decision"><button class="primary-button" type="button">この札で決定</button></div>
          <p class="selection-status" aria-live="polite">選択中：${CARDS.find(card => card.id === selected).name}</p>
        </section>`;
    }

    document.addEventListener('click', event => {
      const card = event.target.closest('.card:not(:disabled)');
      if (!card) return;
      selected = card.dataset.card;
      document.querySelectorAll('.card').forEach(item => {
        const isSelected = item.dataset.card === selected;
        item.classList.toggle('selected', isSelected);
        item.setAttribute('aria-pressed', String(isSelected));
      });
      const selectedName = CARDS.find(item => item.id === selected).name;
      document.querySelectorAll('.selection-status').forEach(item => {
        item.textContent = `選択中：${selectedName}`;
      });
    });
    render();
  </script>
</body>
</html>
