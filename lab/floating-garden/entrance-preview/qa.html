<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; frame-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>庭園入口の公開プレビュー｜画面幅確認</title><style>body{background:#e8edf4;color:#142237;margin:0;font:14px system-ui}header{padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:10px}h1{font-size:15px;margin:0}button{padding:8px}main{overflow:auto;padding:10px 16px}iframe{border:0;display:block;margin:auto;background:#10203e;width:390px;height:1100px}output{font-size:12px}</style></head><body><header><h1>公開プレビュー · 完成版ではありません</h1><button data-width="320">320 px</button><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><output>390 px · 同じ実ファイルを表示</output></header><p style="margin:0 16px">URLを知る方は閲覧できます。入口の表示確認専用で、ゲームは開始できません。</p><main><iframe id="review" title="庭園入口の幅別確認" src="./index.html" width="390" height="1100"></iframe></main><script>for(const b of document.querySelectorAll('[data-width]'))b.addEventListener('click',()=>{document.querySelector('iframe').style.width=b.dataset.width+'px';document.querySelector('output').textContent=b.dataset.width+' px · 同じ実ファイルを表示';});</script></body></html>
