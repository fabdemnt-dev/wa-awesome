<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="月秤の決闘 オンライン2人対戦">
  <title>月秤の決闘｜オンライン対戦</title>
  <link rel="stylesheet" href="moon-scale-duel-online.css">
</head>
<body>
  <main class="online-shell">
    <a id="top-return" class="top-link" href="toybox/">← 🎪 おもちゃ箱へ戻る</a>
    <header>
      <p class="eyebrow">ONLINE MATCH</p>
      <h1>月秤の決闘</h1>
      <p>月影を賭ける、2人だけのオンライン決闘。</p>
    </header>

    <p id="status" class="status" aria-live="polite">匿名ログイン中…</p>

    <section id="auth-retry" class="auth-retry" aria-labelledby="auth-retry-title" hidden>
      <h2 id="auth-retry-title">ログイン処理が完了しませんでした</h2>
      <p id="auth-retry-message">通信状態を確認して、もう一度お試しください。</p>
      <button id="retry-auth" class="primary-button" type="button">もう一度試す</button>
    </section>

    <section id="entry" class="panel" hidden>
      <h2>オンライン対戦</h2>
      <label>表示名<input id="display-name" maxlength="20" autocomplete="nickname" value="旅人"></label>
      <button id="create-room" class="primary-button" type="button">部屋を作る</button>
      <div class="divider" aria-hidden="true"><span>または</span></div>
      <label>招待コード<input id="invite-code" maxlength="26" autocomplete="off" placeholder="MSD1-……-……"></label>
      <button id="join-room" type="button">部屋に参加する</button>
      <p class="stage-note">部屋を作り、2人で月札の秘密提出と同時公開を確認できます。</p>
      <a href="moon-scale-duel/">ひとり用へ戻る</a>
    </section>

    <section id="lobby" class="panel" hidden>
      <h2>待機室</h2>
      <div class="invite-box">
        <span>招待コード</span>
        <strong id="shown-code">参加済み</strong>
        <button id="copy-code" class="small-button" type="button">コピー</button>
      </div>
      <ul id="members" class="seat-list"></ul>
      <p id="lobby-note" class="stage-note"></p>
      <button id="start-match" class="primary-button" type="button" hidden>決闘を始める</button>
    </section>

    <section id="started" class="panel" hidden>
      <p class="eyebrow">DUEL READY</p>
      <h2>決闘を開始しました</h2>
      <div class="duelists" aria-label="参加プレイヤー">
        <div><span>あなた</span><strong id="started-you"></strong><b id="started-you-moon">月影 10</b></div>
        <div><span>対手</span><strong id="started-opponent"></strong><b id="started-opponent-moon">月影 10</b></div>
      </div>
      <p id="started-state" class="round-state"></p>
      <div id="selection-area">
        <p id="selection-note" class="stage-note"></p>
        <div id="online-hand" class="online-hand" aria-label="あなたの月札"></div>
        <button id="submit-card" class="primary-button" type="button" disabled>この札で決定</button>
      </div>
      <div id="revealed-area" hidden>
        <div id="revealed-cards" class="revealed-cards" aria-label="公開された月札"></div>
      </div>
      <div id="copy-area" class="copy-area" hidden>
        <h3>偽りの月：模倣先</h3>
        <p id="copy-note" class="stage-note"></p>
        <div id="copy-choices" class="copy-choices"></div>
        <button id="submit-copy" class="primary-button" type="button" disabled>この効果を模倣する</button>
      </div>
      <div id="round-result" class="round-result" hidden>
        <h3 id="round-result-title">ラウンド結果</h3>
        <ul id="round-messages"></ul>
        <div id="next-round-actions" class="next-round-actions">
          <button id="ready-next-round" class="primary-button" type="button">次のラウンドへ</button>
          <p id="next-round-note" class="stage-note"></p>
          <p id="next-round-countdown" class="wait-countdown"></p>
          <div id="expired-wait-actions" class="expired-wait-actions" hidden>
            <button id="extend-next-round-wait" type="button">もう少し待つ</button>
            <button id="abort-after-wait" class="danger-button" type="button">この決闘を終了する</button>
          </div>
        </div>
      </div>
      <section id="final-result" class="final-result" aria-labelledby="final-result-title" hidden>
        <h3 id="final-result-title"></h3>
        <p id="final-result-reason" class="end-reason"></p>
        <span id="final-result-art" class="result-art"><img id="final-result-image" alt=""></span>
        <p id="final-result-score"></p>
        <div id="rematch-actions" class="end-actions">
          <button id="request-rematch" class="primary-button" type="button">もう一度決闘する</button>
          <p id="rematch-note" class="stage-note" aria-live="polite"></p>
          <a id="result-return" href="toybox/">🎪 おもちゃ箱へ戻る</a>
        </div>
      </section>
      <details id="history-panel" class="history-panel">
        <summary id="history-summary">決闘の記録</summary>
        <div id="round-history"></div>
      </details>
      <p id="stage-note" class="stage-note"></p>
    </section>
  </main>
  <script type="module" src="moon-scale-duel-online-main.js"></script>
</body>
</html>
