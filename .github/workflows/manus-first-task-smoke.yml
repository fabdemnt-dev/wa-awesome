name: Manus first task smoke test recovery

on:
  pull_request:
    branches: [main]
    types: [synchronize]

jobs:
  poll:
    if: github.head_ref == 'test/manus-first-task-20260829'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Poll the existing Manus task only
        shell: bash
        run: |
          set -euo pipefail

          task_id='GNyJgr296vP7kPijRG9sjG'
          MANUS_API_KEY="$(gcloud secrets versions access latest --secret=MANUS_API_KEY --project=wa-awesome)"
          echo "::add-mask::$MANUS_API_KEY"

          reply=''
          final_status='running'
          credits='0'
          profile='unknown'

          for attempt in $(seq 1 36); do
            detail_code="$(curl -sS -o /tmp/detail.json -w '%{http_code}' \
              -H "x-manus-api-key: $MANUS_API_KEY" \
              "https://api.manus.ai/v2/task.detail?task_id=$task_id")"

            if [[ "$detail_code" == '200' ]] && [[ "$(jq -r '.ok // false' /tmp/detail.json)" == 'true' ]]; then
              final_status="$(jq -r '.task.status // "running"' /tmp/detail.json)"
              credits="$(jq -r '.task.credit_usage // 0' /tmp/detail.json)"
              profile="$(jq -r '.task.agent_profile // "unknown"' /tmp/detail.json)"
            else
              echo "Poll $attempt: task.detail HTTP $detail_code; waiting for task visibility"
              sleep 5
              continue
            fi

            messages_code="$(curl -sS -o /tmp/messages.json -w '%{http_code}' \
              -H "x-manus-api-key: $MANUS_API_KEY" \
              "https://api.manus.ai/v2/task.listMessages?task_id=$task_id&order=desc&limit=20")"

            if [[ "$messages_code" == '200' ]] && [[ "$(jq -r '.ok // false' /tmp/messages.json)" == 'true' ]]; then
              reply="$(jq -r '[.messages[]? | select(.type == "assistant_message")][0].assistant_message.content // empty' /tmp/messages.json)"
            fi

            echo "Poll $attempt: status=$final_status credit_usage=$credits messages_http=$messages_code"

            if [[ "$final_status" == 'stopped' ]]; then
              [[ -n "$reply" ]] || { echo 'Task stopped without an assistant reply.' >&2; exit 1; }
              break
            fi
            if [[ "$final_status" == 'waiting' || "$final_status" == 'error' ]]; then
              echo "Unexpected Manus status: $final_status" >&2
              exit 1
            fi
            sleep 5
          done

          if [[ "$final_status" != 'stopped' ]]; then
            echo 'Existing Manus smoke-test task did not finish before timeout.' >&2
            exit 1
          fi

          echo "Manus reply: $reply"
          echo "Credit usage: $credits"
          echo "Agent profile: $profile"
          {
            echo '### Manus first task smoke test'
            echo "- Status: $final_status"
            echo "- Reply: $reply"
            echo "- Credit usage: $credits"
            echo "- Agent profile: $profile"
          } >> "$GITHUB_STEP_SUMMARY"
