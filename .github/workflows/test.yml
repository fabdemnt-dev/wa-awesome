name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Run Firestore rules emulator tests
        run: npm run test:rules
      - name: Install additional Functions dependencies
        run: |
          npm install --prefix functions-manus-test
          npm install --prefix functions-ai-room
      - name: Run Functions emulator tests
        run: npm run test:functions
