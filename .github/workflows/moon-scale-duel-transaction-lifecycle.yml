name: Moon Scale Duel Transaction Lifecycle Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/moon-scale-duel-transaction-lifecycle

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions
      - name: Instrument Firestore SDK installed copy
        run: node diagnostics/instrument-firestore-transaction.cjs
      - name: Prepare Firestore Emulator 1.20.3
        run: |
          gcloud_archive="$RUNNER_TEMP/google-cloud-cli-551.0.0-linux-x86_64.tar.gz"
          gcloud_dir="$RUNNER_TEMP/google-cloud-cli-551.0.0"
          mkdir -p "$gcloud_dir"
          curl --fail --location --silent --show-error \
            'https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-551.0.0-linux-x86_64.tar.gz' \
            --output "$gcloud_archive"
          tar -xzf "$gcloud_archive" -C "$gcloud_dir"
          "$gcloud_dir/google-cloud-sdk/bin/gcloud" --version
          "$gcloud_dir/google-cloud-sdk/bin/gcloud" components install cloud-firestore-emulator --quiet
          emulator_jar=$(find "$gcloud_dir/google-cloud-sdk" -type f -name 'cloud-firestore-emulator*.jar' -print -quit)
          test -n "$emulator_jar"
          sha256sum "$emulator_jar" | tee firestore-emulator-sha256.txt
          java -jar "$emulator_jar" --version | tee firestore-emulator-version.txt
          grep -qx '1.20.3' firestore-emulator-version.txt
          printf 'FIRESTORE_EMULATOR_BINARY_PATH=%s\n' "$emulator_jar" >> "$GITHUB_ENV"
      - name: Verify diagnostic versions
        run: |
          node --version
          npx firebase --version
          node -e "console.log(require('./functions/node_modules/@google-cloud/firestore/package.json').version)"
          grep -q 'FIRESTORE_SDK_TRANSACTION_DIAGNOSTIC' functions/node_modules/@google-cloud/firestore/build/src/transaction.js
      - name: Create emulator secrets
        env:
          LOCAL_MOON_INVITE_KEY: local-test-only-moon-invite-key
          LOCAL_MOON_IP_KEY: local-test-only-moon-ip-key
        run: |
          umask 077
          printf 'MOON_SCALE_DUEL_INVITE_HMAC_KEY=%s\nMOON_SCALE_DUEL_IP_HMAC_KEY=%s\n' "$LOCAL_MOON_INVITE_KEY" "$LOCAL_MOON_IP_KEY" > functions/.secret.local
      - name: Run six-round transaction diagnostic
        env:
          MOON_SCALE_DUEL_TRANSACTION_DIAGNOSTIC: '1'
        run: |
          set +e
          test_started_ms=$(date +%s%3N)
          npx firebase --config firebase.moon-scale-duel-emulator.json emulators:exec \
            --only auth,firestore,database,functions \
            --project demo-moon-scale-duel \
            "node --test --test-force-exit --test-name-pattern='six rounds complete with ordered public history and no seventh round' tests/moon-scale-duel-online-integration.test.mjs" \
            2>&1 | tee transaction-lifecycle.log
          test_status=${PIPESTATUS[0]}
          test_finished_ms=$(date +%s%3N)
          set -e
          printf '%s\n' "$test_status" > transaction-lifecycle-exit-code.txt
          printf '%s\n' "$((test_finished_ms - test_started_ms))" > transaction-lifecycle-duration-ms.txt
      - name: Build sanitized diagnostic artifact
        if: ${{ always() }}
        run: |
          mkdir -p transaction-lifecycle-artifact
          grep -E 'MOON_SCALE_DUEL_TRANSACTION_DIAGNOSTIC|FIRESTORE_SDK_TRANSACTION_DIAGNOSTIC|Transaction lock timeout|Transaction is invalid or closed|INVALID_ARGUMENT|ABORTED|# tests |# pass |# fail |not ok|ok ' transaction-lifecycle.log \
            | sed -E \
              -e 's/(Bearer +)[^ ]+/\1[REDACTED]/gi' \
              -e 's/(token|authorization)([=: ]+)[^ ,}]*/\1\2[REDAACTED/gi' \
            > transaction-lifecycle-artifact/timeline.log || true
          cp transaction-lifecycle-exit-code.txt transaction-lifecycle-artifact/
          cp transaction-lifecycle-duration-ms.txt transaction-lifecycle-artifact/
          cp firestore-emulator-version.txt firestore-emulator-sha256.txt transaction-lifecycle-artifact/
          if [ -f firestore-debug.log ]; then
            grep -Ei 'transaction|lock|retry|timeout|invalid|closed|error|warning' firestore-debug.log \
              > transaction-lifecycle-artifact/firestore.log || true
          fi
      - name: Remove emulator secrets
        if: ${{ always() }}
        run: |
          rm -f functions/.secret.local
          test ! -e functions/.secret.local
      - name: Upload transaction lifecycle diagnostic
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moon-scale-duel-transaction-lifecycle-${{ github.run_id }}
          path: transaction-lifecycle-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve test result
        if: ${{ always() }}
        run: test "$(cat transaction-lifecycle-exit-code.txt)" = 0
