name: Moon Scale Duel Transaction Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/moon-scale-duel-transaction

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Create emulator secrets
        env:
          LOCAL_MOON_INVITE_KEY: local-test-only-moon-invite-key
          LOCAL_MOON_IP_KEY: local-test-only-moon-ip-key
        run: |
          umask 077
          printf 'MOON_SCALE_DUEL_INVITE_HMAC_KEY=%s\nMOON_SCALE_DUEL_IP_HMAC_KEY=%s\n' "$LOCAL_MOON_INVITE_KEY" "$LOCAL_MOON_IP_KEY" > functions/.secret.local
      - name: Record environment versions
        run: |
          mkdir -p diagnostic-artifacts/runtime diagnostic-work
          node --version > diagnostic-artifacts/runtime/node-version.txt
          npm --version > diagnostic-artifacts/runtime/npm-version.txt
          npx firebase --version > diagnostic-artifacts/runtime/firebase-tools-version.txt
          java -version 2> diagnostic-artifacts/runtime/java-version.txt
      - name: Run the normal Moon Scale Duel integration suite with diagnostics
        env:
          MOON_SCALE_DUEL_TRANSACTION_DIAGNOSTIC: '1'
        run: |
          set +e
          npm run test:moon-scale-duel:integration > diagnostic-work/runtime-integration.log 2>&1
          integration_status=$?
          set -e
          printf '%s\n' "$integration_status" > diagnostic-artifacts/runtime-integration-exit-code.txt
      - name: Build sanitized diagnostic artifacts
        if: ${{ always() }}
        run: |
          mkdir -p diagnostic-artifacts/runtime
          sed -n 's/^.*MOON_SCALE_DUEL_TRANSACTION_DIAGNOSTIC //p' diagnostic-work/runtime-integration.log \
            > diagnostic-artifacts/runtime/transaction-events.jsonl || true
          grep -E '^(✔|✖|ℹ|# Subtest:|# tests |# pass |# fail |# skipped |.*(INVALID_ARGUMENT|Transaction is invalid or closed))' diagnostic-work/runtime-integration.log \
            | sed -E \
              -e 's/[0-9a-f]{8}-[0-9a-f-]{27,}/[REDACTED_ID]/gi' \
              -e 's/MSD1-[0-9A-HJKMNP-TV-Z-]+/[REDACTED_INVITE]/g' \
              -e 's/(roomId|inviteCode|gameId|cardId|copyTarget|requestId|token|authorization)([=: ]+)[^ ,}]*/\1\2[REDACTED]/gi' \
              -e 's/(Bearer +)[^ ]+/\1[REDACTED]/gi' \
              -e 's/[A-Za-z0-9_-]{32,}/[REDACTED_VALUE]/g' \
            > diagnostic-artifacts/runtime/sanitized-test-output.log || true
          if [ -f firestore-debug.log ]; then
            grep -Ei 'transaction|lock|retry|timeout|invalid|closed|error|warning' firestore-debug.log \
              | sed -E \
                -e 's/[0-9a-f]{8}-[0-9a-f-]{27,}/[REDACTED_ID]/gi' \
                -e 's/[A-Za-z0-9_-]{32,}/[REDACTED_VALUE]/g' \
              > diagnostic-artifacts/runtime/firestore-transaction-events.log || true
          fi
          node tests/build-moon-scale-duel-runtime-transaction-summary.mjs
      - name: Remove emulator secrets
        if: ${{ always() }}
        run: |
          rm -f functions/.secret.local
          test ! -e functions/.secret.local
      - name: Upload sanitized diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moon-scale-duel-runtime-transaction-diagnostic
          path: diagnostic-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve integration result
        if: ${{ always() }}
        run: |
          test -s diagnostic-artifacts/runtime/transaction-events.jsonl
          test "$(cat diagnostic-artifacts/runtime-integration-exit-code.txt)" = 0
