name: Moon Scale Duel Transaction Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - diagnostic/moon-scale-duel-transaction

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm ci --prefix functions
      - name: Create emulator secrets
        env:
          LOCAL_MOON_INVITE_KEY: local-test-only-moon-invite-key
          LOCAL_MOON_IP_KEY: local-test-only-moon-ip-key
        run: |
          umask 077
          printf 'MOON_SCALE_DUEL_INVITE_HMAC_KEY=%s\nMOON_SCALE_DUEL_IP_HMAC_KEY=%s\n' "$LOCAL_MOON_INVITE_KEY" "$LOCAL_MOON_IP_KEY" > functions/.secret.local
      - name: Record diagnostic versions
        run: |
          mkdir -p diagnostic-artifacts
          npx firebase --version > diagnostic-artifacts/current-firebase-tools-version.txt
          npx --yes firebase-tools@15.30.0 --version > diagnostic-artifacts/candidate-firebase-tools-version.txt
          printf '%s\n' '1.19.8' > diagnostic-artifacts/current-firestore-emulator-version.txt
          printf '%s\n' '1.22.0' > diagnostic-artifacts/candidate-firestore-emulator-version.txt
          java -version 2> diagnostic-artifacts/java-version.txt
          node --version > diagnostic-artifacts/node-version.txt
      - name: Run current and candidate diagnostics on the same runner
        run: |
          chmod +x tests/run-moon-scale-duel-transaction-version-diagnostic.sh
          for version_spec in 'current current' 'candidate 15.30.0'; do
            read -r version_label cli_version <<< "$version_spec"
            tests/run-moon-scale-duel-transaction-version-diagnostic.sh "$version_label" "$cli_version" minimal-submit tests/moon-scale-duel-transaction-diagnostic.test.mjs 'diagnostic: repeat minimal simultaneous moonScaleDuelSubmitCard'
            tests/run-moon-scale-duel-transaction-version-diagnostic.sh "$version_label" "$cli_version" promise-all tests/moon-scale-duel-transaction-diagnostic.test.mjs 'diagnostic: compare contending Firestore transactions using parallel'
            tests/run-moon-scale-duel-transaction-version-diagnostic.sh "$version_label" "$cli_version" sequential tests/moon-scale-duel-transaction-diagnostic.test.mjs 'diagnostic: compare contending Firestore transactions using sequential'
            tests/run-moon-scale-duel-transaction-version-diagnostic.sh "$version_label" "$cli_version" get-all tests/moon-scale-duel-transaction-diagnostic.test.mjs 'diagnostic: compare contending Firestore transactions using getAll'
            tests/run-moon-scale-duel-transaction-version-diagnostic.sh "$version_label" "$cli_version" six-rounds tests/moon-scale-duel-online-integration.test.mjs 'six rounds complete with ordered public history and no seventh round'
            tests/run-moon-scale-duel-transaction-version-diagnostic.sh "$version_label" "$cli_version" readiness tests/moon-scale-duel-online-integration.test.mjs 'expired readiness can be extended idempotently only by the waiting player'
          done
      - name: Build version comparison summary
        if: ${{ always() }}
        run: |
          jq -s '{cases: .}' diagnostic-artifacts/*/*/case-summary.json > diagnostic-artifacts/summary.json
      - name: Remove emulator secrets
        if: ${{ always() }}
        run: |
          rm -f functions/.secret.local
          test ! -e functions/.secret.local
      - name: Upload sanitized diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: moon-scale-duel-transaction-diagnostic
          path: diagnostic-artifacts/
          if-no-files-found: warn
          retention-days: 7
