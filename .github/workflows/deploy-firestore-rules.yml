# ============================================================
# firestore.rules を main に push するたびに Firebase へ自動反映
# ------------------------------------------------------------
# 認証: GCP サービスアカウントJSON（Secrets: FIREBASE_SERVICE_ACCOUNT_JSON）
# 手動実行: Actions タブ → Deploy Firestore Rules → Run workflow
# ============================================================
name: Deploy Firestore Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # 複数行シェルは使わず、1行で firebase.json を作る
      - name: Create firebase.json
        run: echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome
      - name: Create minimal firebase.json if missing
        run: |
          if [ ! -f firebase.json ]; then
            echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
            echo "created firebase.json (minimal)"
          else
            echo "firebase.json already exists"
          fi

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome
            echo "created firebase.json (minimal)"
          else
            echo "firebase.json already exists"
          fi

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome
