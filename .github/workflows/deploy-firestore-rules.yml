# ============================================================
# firestore.rules を push のたびに自動で Firebase へ反映するワークフロー
# 認証: GCP サービスアカウントJSON（PC不要 / スマホだけで完結）
# ------------------------------------------------------------
# 必要なもの: GitHub Secrets に FIREBASE_SERVICE_ACCOUNT_JSON が登録されていること
# 動くタイミング: firestore.rules が変更されて main に push されたとき
# 手動実行も可: Actions タブ →「Deploy Firestore Rules」→ Run workflow
# ============================================================
name: Deploy Firestore Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Setup Firebase CLI
        uses: w9jds/setup-firebase@main

      - name: Create minimal firebase.json if missing
        run: |
          if [ ! -f firebase.json ]; then
            echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
            echo "created firebase.json (minimal)"
          else
            echo "firebase.json already exists"
          fi

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome
