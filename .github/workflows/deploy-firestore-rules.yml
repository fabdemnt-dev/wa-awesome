# ============================================================
# firestore.rules を push のたびに自動で Firebase へ反映するワークフロー
# ------------------------------------------------------------
# 認証: GCP サービスアカウントJSON（PC不要）
# 必要な Secrets: FIREBASE_SERVICE_ACCOUNT_JSON（既に登録済み）
# 動くタイミング: firestore.rules を変更して main に push した時
# 手動実行: Actions タブ → Deploy Firestore Rules → Run workflow
# ============================================================
name: Deploy Firestore Rules

on:
  push:
    branches: [ main ]
    paths:
      - 'firestore.rules'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # サービスアカウントJSONで認証 →
      # 以降のステップで GOOGLE_APPLICATION_CREDENTIALS が自動設定される
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # firebase CLI を入れるだけ（firebase_token不要）
      # → 上のステップの GOOGLE_APPLICATION_CREDENTIALS で自動的にログインされる
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Create minimal firebase.json if missing
        run: |
          if [ ! -f firebase.json ]; then
            echo '{"firestore":{"rules":"firestore.rules"}}' > firebase.json
            echo "created firebase.json (minimal)"
          else
            echo "firebase.json already exists"
          fi

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome
            echo "created firebase.json (minimal)"
          else
            echo "firebase.json already exists"
          fi

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome

      - name: Deploy Firestore rules
        run: firebase deploy --only firestore:rules --project wa-awesome
