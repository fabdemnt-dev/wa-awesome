name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-firestore-rules.yml'
      - 'firebase.json'
      - 'firestore.rules'
      - 'functions/**'
      - 'functions-manus-test/**'
      - 'functions-ai-room/**'
  workflow_dispatch:
    inputs:
      deploy_rules:
        description: 'Deploy Firestore Rules after the client is live'
        required: false
        default: true
        type: boolean
      wait_for_client:
        description: 'Wait for the new GitHub Pages client before Rules deployment'
        required: false
        default: true
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Install Manus test dependencies
        run: npm install --prefix functions-manus-test

      - name: Install AI room dependencies
        run: npm install --prefix functions-ai-room

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Functions artifact cleanup
        run: firebase functions:artifacts:setpolicy --days 7 --project wa-awesome

      - name: Deploy Cloud Functions first
        run: firebase deploy --only functions --project wa-awesome --force

      - name: Wait for the new client to be publicly available
        if: github.event_name == 'push' || (inputs.deploy_rules && inputs.wait_for_client)
        env:
          CLIENT_URL: https://fabdemnt-dev.github.io/wa-awesome/haiku-room.js
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            # Consume the full response: grep -q can close the pipe early,
            # causing curl (23) and a false failure under pipefail.
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 30 "$CLIENT_URL" | grep -F 'joinHaikuRoom' > /dev/null; then
              echo 'New client is publicly available.'
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment ($attempt/60)..."
            sleep 10
          done
          echo 'Timed out waiting for the new client.' >&2
          exit 1

      - name: Deploy Firestore Rules after the client is live
        if: github.event_name == 'push' || inputs.deploy_rules
        run: firebase deploy --only firestore:rules --project wa-awesome --force
