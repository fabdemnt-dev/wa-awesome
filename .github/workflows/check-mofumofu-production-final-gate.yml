name: Read-only production Multi final gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Authenticate with existing production credential
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: wa-awesome
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Read fixed Function metadata and service IAM policies
        env:
          READ_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request, urllib.error
          PROJECT = 'wa-awesome'
          REGION = 'asia-northeast1'
          RTDB_URL = 'https://wa-awesome-default-rtdb.asia-southeast1.firebasedatabase.app'
          EXPECTED = {'createMofumofuMultiRoom': {'env_sha256': '48e77bdee9ceb90f575a62a40a7f3e40ef2e1ee443fb8e8e07981b4eecea2a3d', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T03:09:55.624148088Z', 'needs_rtdb': True}, 'joinMofumofuMultiRoom': {'env_sha256': '65fa56542e9d61c1df8d8d0d79ec303cb365d74ff656694f7b2c44ec67acab57', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T03:10:38.011583575Z', 'needs_rtdb': True}, 'startMofumofuMultiGame': {'env_sha256': '3f7c2492a26d23d89a6991a7a6088c232624132c2a449e2a6823e617b1a85438', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T03:10:37.862958606Z', 'needs_rtdb': True}, 'makeMofumofuMultiOffer': {'env_sha256': 'a6362ff42b9fd1b4b885a6d80721de2276daca96b461357eb319f65b23ed4d29', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T03:44:21.453649147Z', 'needs_rtdb': True}, 'judgeMofumofuMultiOffer': {'env_sha256': 'fd37a33f6223984febe240d0ef1263acedc67ce03158c2e3254fcf1b180ce146', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T03:45:17.530003668Z', 'needs_rtdb': True}, 'leaveMofumofuMultiGame': {'env_sha256': '940ae501c6bb9c0753ca973784434990d7de688f64ef237f72673cdb9668712d', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-30T03:48:02.889017070Z', 'needs_rtdb': False}, 'leaveMofumofuMultiWaitingRoom': {'env_sha256': '45709d2b5d93c931b2684c8c6eb159793e977c6799b5669112abe35ff5567c18', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-30T05:07:35.779380474Z', 'needs_rtdb': False}, 'closeMofumofuMultiWaitingRoom': {'env_sha256': '735b4d1875a85034f9864a8aa77b86de4b26549a72e29fff5349921bd4a01748', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-30T06:12:16.368976013Z', 'needs_rtdb': False}, 'authorizeMofumofuMultiPresence': {'env_sha256': '40aa45ebf0b50b2f8b9e4d77d60da91aaf4d3936bdd4c49acf3cc5d373e93de3', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T04:12:24.685225779Z', 'needs_rtdb': True}, 'resumeMofumofuMultiRoom': {'env_sha256': '3d06c7671f42e7e4c3295b83a4ec3834939e388373c7c55180b0d2d5749893f6', 'secret_sha256': 'b539ecb0bbe184572da66ad42e53314f8f855002da61dd1ab98f0da7db43a817', 'createTime': '2026-09-26T04:13:17.493853014Z', 'needs_rtdb': True}}
          def digest(value):
              return hashlib.sha256(json.dumps(value, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          def get(url):
              request = urllib.request.Request(url, method='GET', headers={'Authorization': 'Bearer ' + os.environ['READ_TOKEN']})
              with urllib.request.urlopen(request, timeout=12) as response:
                  return json.load(response)
          lines = ['| Function | ACTIVE/config | RTDB contract | env preserved | Secret | Invoker | same identity |', '|---|---|---|---|---|---|---|']
          passed = True
          for name, expected in EXPECTED.items():
              try:
                  resource = f'projects/{PROJECT}/locations/{REGION}/functions/{name}'
                  function = get('https://cloudfunctions.googleapis.com/v2/' + resource)
                  service = function['serviceConfig']
                  env = service.get('environmentVariables', {})
                  config_ok = function['name'] == resource and function['state'] == 'ACTIVE' and function['environment'] == 'GEN_2' and function['buildConfig']['runtime'] == 'nodejs22' and function['labels'].get('firebase-functions-codebase') == 'mofumofu-multi' and env.get('GCLOUD_PROJECT') == PROJECT
                  config_ok = config_ok and str(json.loads(env['FIREBASE_CONFIG'])['projectId']) == PROJECT
                  rtdb_ok = env.get('MOFUMOFU_RTDB_URL') == RTDB_URL if expected['needs_rtdb'] else 'MOFUMOFU_RTDB_URL' not in env
                  env_ok = digest(env) == expected['env_sha256']
                  secrets_ok = digest(service.get('secretEnvironmentVariables', [])) == expected['secret_sha256']
                  identity_ok = function.get('createTime') == expected['createTime']
                  service_name = f'projects/{PROJECT}/locations/{REGION}/services/{name.lower()}'
                  assert service['service'] == service_name, 'service identity mismatch'
                  policy = get('https://run.googleapis.com/v2/' + service_name + ':getIamPolicy?options.requestedPolicyVersion=3')
                  invoker_ok = any(b.get('role') == 'roles/run.invoker' and 'allUsers' in b.get('members', []) and not b.get('condition') for b in policy.get('bindings', []))
                  checks = [config_ok, rtdb_ok, env_ok, secrets_ok, invoker_ok, identity_ok]
                  passed = passed and all(checks)
                  lines.append('| ' + name + ' | ' + ' | '.join('YES' if ok else 'NO' for ok in checks) + ' |')
              except urllib.error.HTTPError as error:
                  passed = False
                  lines.append('| ' + name + ' | HTTP ' + str(error.code) + ' | UNKNOWN | UNKNOWN | UNKNOWN | UNKNOWN | UNKNOWN |')
              except Exception as error:
                  passed = False
                  lines.append('| ' + name + ' | ' + type(error).__name__ + ' | UNKNOWN | UNKNOWN | UNKNOWN | UNKNOWN | UNKNOWN |')
          lines.append('')
          lines.append('FINAL_GATE: PASS' if passed else 'FINAL_GATE: FAIL_OR_UNCONFIRMED')
          result = '\n'.join(lines) + '\n'
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(result)
          raise SystemExit(0 if passed else 1)
          PY
