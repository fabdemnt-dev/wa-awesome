<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff5e8">
  <title>オンライン版をえらぶ｜もふもふ大集合！</title>
  <style>
    body { box-sizing: border-box; min-height: 100vh; margin: 0; padding: 28px 16px; background: #fff5e8; color: #554139; font-family: system-ui, sans-serif; }
    main { max-width: 480px; margin: 8vh auto 0; padding: 26px 20px; border-radius: 28px; background: #fffaf5; box-shadow: 0 8px 24px #7c524226; }
    h1 { margin: 0 0 8px; font-size: 1.7rem; text-align: center; }
    p { text-align: center; }
    nav { display: grid; gap: 12px; margin-top: 24px; }
    a { display: grid; gap: 4px; padding: 16px; border: 2px solid #eadbd2; border-radius: 18px; background: white; color: inherit; text-decoration: none; box-shadow: 0 4px 10px #50372819; }
    a:focus-visible { outline: 3px solid #b16650; outline-offset: 3px; }
    strong { font-size: 1.15rem; }
    small { font-size: .82rem; color: #796963; }
  </style>
</head>
<body>
  <main>
    <h1>もふもふ大集合！</h1>
    <p>どのオンラインで遊びますか？</p>
    <nav aria-label="オンライン版をえらぶ">
      <a href="/"><strong>2人＋こはる</strong><small>いま遊べるオンライン版</small></a>
      <a href="/multi"><strong>3〜6人</strong><small>みんなで遊べる3〜6人版</small></a>
    </nav>
  </main>
</body>
</html>
