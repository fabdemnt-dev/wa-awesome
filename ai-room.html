<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AI会議室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:10px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}h1{font-size:21px;margin:0 0 4px}.sub,.status,.note{font-size:12px;color:#64748b}.sub{margin:0 0 14px}.access,.composer{display:grid;gap:8px}.access{padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;margin-bottom:10px}label{display:grid;gap:4px;font-size:12px;color:#475569}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:inherit}textarea{min-height:96px;resize:vertical}button{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.primary{background:#2563eb;color:#fff}.secondary{background:#e2e8f0;color:#334155}.row,.sendrow{display:flex;gap:7px;align-items:center;justify-content:space-between;flex-wrap:wrap}.messages{height:54vh;min-height:300px;overflow:auto;border:1px solid #e2e8f0;border-radius:12px;padding:10px;background:#f8fafc;display:grid;align-content:start;gap:8px;margin-bottom:10px}.msg{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:9px 10px}.msg.user{background:#eff6ff;border-color:#93c5fd}.msg.ai{background:#f0fdf4;border-color:#86efac}.name{font-weight:800;font-size:13px;margin-bottom:3px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}.empty{padding:28px 6px;text-align:center;color:#94a3b8;font-size:13px}.error{color:#b91c1c}.note{margin:4px 0 0}@media(max-width:520px){main{padding:7px}.panel{padding:10px;border-radius:11px}.row button{padding:8px 10px;font-size:12px}}
</style>
</head>
<body>
<main><section class="panel">
<h1>🤖 AI会議室</h1>
<p class="sub">まずはOpenAIとの1対1相談版です。会話はこの画面だけに表示され、ページを閉じると消えます。</p>

<div class="access">
  <label>アクセスコード
    <input id="accessCode" type="password" maxlength="100" autocomplete="off" placeholder="AI会議室のアクセスコード">
  </label>
  <div class="row">
    <span class="note">コードはこの端末のブラウザに保存できます。</span>
    <button id="forgetBtn" class="secondary" type="button">コードを忘れる</button>
  </div>
</div>

<div id="messages" class="messages"><div class="empty">OpenAIに相談した内容がここに表示されます。</div></div>
<div class="composer">
  <textarea id="text" maxlength="4000" placeholder="相談したいことを書いてください"></textarea>
  <div class="sendrow">
    <span id="status" class="status">送信するとOpenAI APIを1回使用します。</span>
    <button id="sendBtn" class="primary" type="button">OpenAIに相談</button>
  </div>
</div>
</section></main>

<script type="module">
import { app } from './firebase-config.js';
import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';

const $ = (id) => document.getElementById(id);
const accessCode = $('accessCode');
const messages = $('messages');
const text = $('text');
const status = $('status');
const sendBtn = $('sendBtn');
const forgetBtn = $('forgetBtn');

accessCode.value = localStorage.getItem('aiRoomAccessCode') || '';
const functions = getFunctions(app, 'asia-northeast1');
const askOpenAI = httpsCallable(functions, 'askAiRoomOpenAI');
let user = null;

function note(message, isError = false) {
  status.textContent = message;
  status.classList.toggle('error', isError);
}

function authReady() {
  if (user) return Promise.resolve(user);
  const auth = getAuth(app);
  return new Promise((resolve, reject) => {
    let done = false;
    const unsub = onAuthStateChanged(auth, async (existing) => {
      if (done) return;
      done = true;
      unsub();
      try {
        user = existing || (await signInAnonymously(auth)).user;
        resolve(user);
      } catch (error) {
        reject(error);
      }
    }, reject);
  });
}

function addMessage(name, body, kind) {
  const empty = messages.querySelector('.empty');
  if (empty) empty.remove();
  const box = document.createElement('article');
  box.className = `msg ${kind}`;
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = name;
  const b = document.createElement('div');
  b.className = 'body';
  b.textContent = body;
  box.append(n, b);
  messages.append(box);
  messages.scrollTop = messages.scrollHeight;
}

async function send() {
  const code = accessCode.value.trim();
  const message = text.value.trim();
  if (!code) {
    note('アクセスコードを入力してください。', true);
    accessCode.focus();
    return;
  }
  if (!message) {
    note('相談内容を入力してください。', true);
    text.focus();
    return;
  }

  sendBtn.disabled = true;
  accessCode.disabled = true;
  text.disabled = true;
  note('OpenAIの返答を待っています…');
  addMessage('あなた', message, 'user');

  try {
    await authReady();
    localStorage.setItem('aiRoomAccessCode', code);
    const response = await askOpenAI({ accessCode: code, message });
    const reply = response?.data?.reply;
    if (typeof reply !== 'string' || !reply.trim()) throw new Error('返答が空でした。');
    addMessage('OpenAI', reply.trim(), 'ai');
    text.value = '';
    note('返答を受け取りました。');
  } catch (error) {
    const codeName = typeof error?.code === 'string' ? error.code : '';
    if (codeName.includes('permission-denied')) {
      note('アクセスコードが正しくありません。', true);
    } else if (codeName.includes('unauthenticated')) {
      note('接続に失敗しました。ページを再読み込みしてください。', true);
    } else if (codeName.includes('deadline-exceeded')) {
      note('OpenAIの応答がタイムアウトしました。もう一度お試しください。', true);
    } else {
      note('OpenAIから返答を取得できませんでした。', true);
    }
  } finally {
    sendBtn.disabled = false;
    accessCode.disabled = false;
    text.disabled = false;
    text.focus();
  }
}

forgetBtn.onclick = () => {
  localStorage.removeItem('aiRoomAccessCode');
  accessCode.value = '';
  note('この端末に保存したアクセスコードを削除しました。');
  accessCode.focus();
};
sendBtn.onclick = send;
text.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
    event.preventDefault();
    send();
  }
});
</script>
</body>
</html>
