<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>AI会議室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8fafc;color:#1e293b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:10px}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}h1{font-size:21px;margin:0}.sub,.status,.note{font-size:12px;color:#64748b}.sub{margin:4px 0 14px}.access,.composer{display:grid;gap:8px}.access{padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;margin-bottom:10px}label{display:grid;gap:4px;font-size:12px;color:#475569}input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:10px;font:inherit}textarea{min-height:96px;resize:vertical}button{border:0;border-radius:9px;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.primary{background:#2563eb;color:#fff}.manusAction{background:#7c3aed;color:#fff}.secondary{background:#e2e8f0;color:#334155}.row,.sendrow,.titleRow,.actionButtons{display:flex;gap:7px;align-items:center;justify-content:space-between;flex-wrap:wrap}.actionButtons{justify-content:flex-end}.messages{height:54vh;min-height:300px;overflow:auto;border:1px solid #e2e8f0;border-radius:12px;padding:10px;background:#f8fafc;display:grid;align-content:start;gap:8px;margin-bottom:10px}.msg{background:#fff;border:1px solid #e2e8f0;border-radius:11px;padding:9px 10px}.msg.user{background:#eff6ff;border-color:#93c5fd}.msg.ai{background:#f0fdf4;border-color:#86efac}.msg.manus{background:#faf5ff;border-color:#c4b5fd}.name{font-weight:800;font-size:13px;margin-bottom:3px}.body{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}.empty{padding:28px 6px;text-align:center;color:#94a3b8;font-size:13px}.error{color:#b91c1c}.note{margin:4px 0 0}@media(max-width:520px){main{padding:7px}.panel{padding:10px;border-radius:11px}.row button,.titleRow button,.actionButtons button{padding:8px 10px;font-size:12px}.sendrow{align-items:flex-start}.actionButtons{width:100%}.actionButtons button{flex:1}}
</style>
</head>
<body>
<main><section class="panel">
<div class="titleRow">
  <h1>🤖 AI会議室</h1>
  <button id="clearBtn" class="secondary" type="button">会話をクリア</button>
</div>
<p class="sub">ChatGPTとManusが参加できます。直前の会話を共有して返答します。履歴はこの画面だけにあり、ページを閉じると消えます。</p>

<div class="access">
  <label>アクセスコード
    <input id="accessCode" type="password" maxlength="100" autocomplete="off" placeholder="AI会議室のアクセスコード">
  </label>
  <div class="row">
    <span class="note">コードはこの端末のブラウザに保存できます。</span>
    <button id="forgetBtn" class="secondary" type="button">コードを忘れる</button>
  </div>
</div>

<div id="messages" class="messages"><div class="empty">ChatGPTまたはManusに相談した内容がここに表示されます。</div></div>
<div class="composer">
  <textarea id="text" maxlength="4000" placeholder="相談したいことを書いてください"></textarea>
  <div class="sendrow">
    <span id="status" class="status">ChatGPTはOpenAI API、ManusはManusクレジットを使用します。</span>
    <div class="actionButtons">
      <button id="chatgptBtn" class="primary" type="button">ChatGPTに相談</button>
      <button id="manusBtn" class="manusAction" type="button">Manusに依頼</button>
    </div>
  </div>
</div>
</section></main>

<script type="module">
import { app } from './firebase-config.js';
import { getAuth, onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js';

const $ = (id) => document.getElementById(id);
const accessCode = $('accessCode');
const messages = $('messages');
const text = $('text');
const status = $('status');
const chatgptBtn = $('chatgptBtn');
const manusBtn = $('manusBtn');
const forgetBtn = $('forgetBtn');
const clearBtn = $('clearBtn');

accessCode.value = localStorage.getItem('aiRoomAccessCode') || '';
const functions = getFunctions(app, 'asia-northeast1');
const askOpenAI = httpsCallable(functions, 'askAiRoomOpenAI');
const createManusTask = httpsCallable(functions, 'createAiRoomManusTask');
const getManusTask = httpsCallable(functions, 'getAiRoomManusTask');
const conversation = [];
let user = null;
let busy = false;

function note(message, isError = false) {
  status.textContent = message;
  status.classList.toggle('error', isError);
}

function setBusy(value) {
  busy = value;
  chatgptBtn.disabled = value;
  manusBtn.disabled = value;
  clearBtn.disabled = value;
  accessCode.disabled = value;
  text.disabled = value;
}

function authReady() {
  if (user) return Promise.resolve(user);
  const auth = getAuth(app);
  return new Promise((resolve, reject) => {
    let done = false;
    const unsub = onAuthStateChanged(auth, async (existing) => {
      if (done) return;
      done = true;
      unsub();
      try {
        user = existing || (await signInAnonymously(auth)).user;
        resolve(user);
      } catch (error) {
        reject(error);
      }
    }, reject);
  });
}

function addMessage(name, body, kind) {
  const empty = messages.querySelector('.empty');
  if (empty) empty.remove();
  const box = document.createElement('article');
  box.className = `msg ${kind}`;
  const n = document.createElement('div');
  n.className = 'name';
  n.textContent = name;
  const b = document.createElement('div');
  b.className = 'body';
  b.textContent = body;
  box.append(n, b);
  messages.append(box);
  messages.scrollTop = messages.scrollHeight;
}

function recentHistory() {
  const selected = [];
  let totalChars = 0;
  for (let i = conversation.length - 1; i >= 0 && selected.length < 12; i -= 1) {
    const item = conversation[i];
    if (totalChars + item.content.length > 12000) break;
    selected.unshift(item);
    totalChars += item.content.length;
  }
  return selected;
}

function recordTurn(message, speaker, reply) {
  conversation.push(
    { speaker: 'user', content: message },
    { speaker, content: reply },
  );
  if (conversation.length > 24) conversation.splice(0, conversation.length - 24);
}

function resetConversation() {
  if (busy) return;
  conversation.length = 0;
  messages.replaceChildren();
  const empty = document.createElement('div');
  empty.className = 'empty';
  empty.textContent = 'ChatGPTまたはManusに相談した内容がここに表示されます。';
  messages.append(empty);
  note('会話をクリアしました。');
}

function readRequest(maxLength = 4000) {
  const code = accessCode.value.trim();
  const message = text.value.trim();
  if (!code) {
    note('アクセスコードを入力してください。', true);
    accessCode.focus();
    return null;
  }
  if (!message) {
    note('相談内容を入力してください。', true);
    text.focus();
    return null;
  }
  if (message.length > maxLength) {
    note(`このAIへの依頼は${maxLength}文字以内にしてください。`, true);
    text.focus();
    return null;
  }
  return { code, message };
}

function errorCode(error) {
  return typeof error?.code === 'string' ? error.code : '';
}

function commonError(error, aiName) {
  const codeName = errorCode(error);
  if (codeName.includes('permission-denied')) return 'アクセスコードが正しくありません。';
  if (codeName.includes('unauthenticated')) return '接続に失敗しました。ページを再読み込みしてください。';
  if (codeName.includes('deadline-exceeded')) return `${aiName}の応答がタイムアウトしました。もう一度お試しください。`;
  return `${aiName}から返答を取得できませんでした。`;
}

function delay(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

async function sendChatGPT() {
  if (busy) return;
  const request = readRequest(4000);
  if (!request) return;
  const { code, message } = request;

  setBusy(true);
  note('ChatGPTの返答を待っています…');
  addMessage('あなた', message, 'user');

  try {
    await authReady();
    localStorage.setItem('aiRoomAccessCode', code);
    const history = recentHistory();
    const response = await askOpenAI({ accessCode: code, message, history });
    const reply = response?.data?.reply;
    if (typeof reply !== 'string' || !reply.trim()) throw new Error('返答が空でした。');
    const cleanReply = reply.trim();
    recordTurn(message, 'chatgpt', cleanReply);
    addMessage('ChatGPT', cleanReply, 'ai');
    text.value = '';
    note('ChatGPTの返答を受け取りました。会話は次の相談にも引き継がれます。');
  } catch (error) {
    note(commonError(error, 'ChatGPT'), true);
  } finally {
    setBusy(false);
    text.focus();
  }
}

async function waitForManus(code, taskId) {
  for (let attempt = 1; attempt <= 36; attempt += 1) {
    await delay(attempt === 1 ? 2500 : 5000);
    try {
      const response = await getManusTask({ accessCode: code, taskId });
      const data = response?.data || {};
      const taskStatus = data.status || 'running';
      if (taskStatus === 'stopped') {
        if (typeof data.reply !== 'string' || !data.reply.trim()) throw new Error('Manusの返答が空でした。');
        return data.reply.trim();
      }
      if (taskStatus === 'waiting') {
        const error = new Error(data.waitingDescription || 'Manusが確認を待っています。');
        error.manusWaiting = true;
        throw error;
      }
      if (taskStatus === 'error') {
        throw new Error(data.error || 'Manusタスクでエラーが発生しました。');
      }
      note(`Manusが作業中です… (${attempt}/36)`);
    } catch (error) {
      if (error?.manusWaiting) throw error;
      const codeName = errorCode(error);
      if (codeName.includes('permission-denied') || codeName.includes('unauthenticated')) throw error;
      if (attempt === 36) throw error;
      note(`Manusの結果を待っています… (${attempt}/36)`);
    }
  }
  const error = new Error('Manusの応答待ちがタイムアウトしました。');
  error.code = 'deadline-exceeded';
  throw error;
}

async function sendManus() {
  if (busy) return;
  const request = readRequest(2500);
  if (!request) return;
  const { code, message } = request;

  const approved = window.confirm('Manusの新しいタスクを1件開始します。Manusクレジットを使用します。実行しますか？');
  if (!approved) {
    note('Manusへの依頼をキャンセルしました。');
    return;
  }

  setBusy(true);
  note('Manusタスクを開始しています…');
  addMessage('あなた', message, 'user');

  try {
    await authReady();
    localStorage.setItem('aiRoomAccessCode', code);
    const history = recentHistory();
    const created = await createManusTask({ accessCode: code, message, history });
    const taskId = created?.data?.taskId;
    if (typeof taskId !== 'string' || !taskId) throw new Error('ManusタスクIDを取得できませんでした。');
    note('Manusが作業中です…');
    const cleanReply = await waitForManus(code, taskId);
    recordTurn(message, 'manus', cleanReply);
    addMessage('Manus', cleanReply, 'manus');
    text.value = '';
    note('Manusの返答を受け取りました。会話は次の相談にも引き継がれます。');
  } catch (error) {
    if (error?.manusWaiting) {
      note(`Manusが確認待ちになりました。自動承認はしません。${error.message}`, true);
    } else {
      note(commonError(error, 'Manus'), true);
    }
  } finally {
    setBusy(false);
    text.focus();
  }
}

forgetBtn.onclick = () => {
  if (busy) return;
  localStorage.removeItem('aiRoomAccessCode');
  accessCode.value = '';
  note('この端末に保存したアクセスコードを削除しました。');
  accessCode.focus();
};
clearBtn.onclick = resetConversation;
chatgptBtn.onclick = sendChatGPT;
manusBtn.onclick = sendManus;
text.addEventListener('keydown', (event) => {
  if ((event.ctrlKey || event.metaKey) && event.key === 'Enter') {
    event.preventDefault();
    sendChatGPT();
  }
});
</script>
</body>
</html>
