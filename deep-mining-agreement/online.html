<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111722"><title>深層採掘協定｜オンライン</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="online.css"></head>
<body><main id="online-app" class="online-shell">
  <nav><a class="title-return-link" href="./">← 人数選択へ戻る</a></nav>
  <header><p class="eyebrow">ONLINE MINING</p><h1>深層採掘協定</h1><p id="mode-label" class="subtitle"></p></header>
  <p id="status" class="status" aria-live="polite">匿名ログイン中…</p>
  <section id="entry" class="panel" hidden><h2>オンライン採掘</h2><label>表示名<input id="display-name" maxlength="20" value="採掘者" autocomplete="nickname"></label><button id="create-room" class="button button--primary">部屋を作る</button><div class="divider">または</div><label>部屋コード<input id="invite-code" maxlength="26" placeholder="DMA1-……-……" autocomplete="off"></label><button id="join-room" class="button">部屋に参加する</button></section>
  <section id="lobby" class="panel" hidden><h2>待機室</h2><div class="invite"><span>部屋コード</span><strong id="shown-code">参加済み</strong><button id="copy-code" class="button">コピー</button></div><ul id="members" class="member-list"></ul><p id="lobby-note"></p><button id="start-game" class="button button--primary" hidden>採掘を始める</button></section>
  <section id="game" hidden><header class="topbar"><div><p id="round" class="round-label"></p><h2>オンライン採掘</h2></div><span id="you" class="badge"></span></header><section class="panel danger-panel"><div class="danger-head"><h2>崩落危険度</h2><strong id="danger"></strong></div><div class="danger-track"><div id="danger-fill" class="danger-fill"></div></div></section><section class="panel ore-panel"><div id="ore-icon" class="ore-icon"></div><div><h2 id="ore-name"></h2><p id="ore-note"></p></div></section><section class="panel"><h2>採掘者</h2><div id="players" class="seat-grid"></div></section><section id="action-panel" class="panel"><h2>今回の行動</h2><p id="wait-note" class="muted"></p><div id="actions" class="action-grid"></div><label class="support-check"><input id="scout" type="checkbox"> 🔭 偵察を使う</label><label id="accusation-wrap" hidden>⚖️ 告発<select id="accusation"><option value="">使わない</option></select></label><button id="submit-action" class="button button--primary" disabled>行動を確定する</button></section><section id="result" class="panel" hidden></section><details class="panel history"><summary>全履歴を見る</summary><div id="history" class="history-list"></div></details></section>
  <div class="button-stack"><button id="leave" class="button" hidden>この画面を退出する</button><a class="text-link" href="../toybox/">🎪 おもちゃ箱へ戻る</a></div>
</main><script type="module" src="online.js"></script></body></html>
